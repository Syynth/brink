description = "A choice nested inside another choice's own body (a nested weave branch), where the innermost choice set has no gather and nothing follows it anywhere in the enclosing knot. Real ink raises `RuntimeError::RanOutOfContent` on the fall-through, same as a top-level knot/stitch loose end. Insurance fixture for #1522: exercises the same is_root_content_scope-gated build_continuation_container path fixed by #1515, one nesting level deeper than any existing fixture (label-scope-error's loose end is at the top level of a stitch body, not nested inside a sibling choice's own content) — this shape had no corpus coverage."

