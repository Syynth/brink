# release-plz — automated crates.io publishing for the brink workspace.
# Docs: https://release-plz.dev/docs/config
#
# Versioning is unified: every published crate inherits `version.workspace =
# true`, so release-plz bumps the single workspace version (and the matching
# version fields in root `[workspace.dependencies]`) in lockstep. On a push to
# `main` it opens/updates a "release PR" with the version bump + changelogs;
# merging that PR publishes the changed crates to crates.io in dependency order
# and creates per-crate git tags + GitHub releases.

[workspace]
# Generate/refresh CHANGELOG.md files from conventional commits.
changelog_update = true
# Create git tags + GitHub releases (the tags are what cargo-dist keys off of to
# build binaries — see docs/releasing.md).
git_tag_enable = true
git_release_enable = true
# Keep changelog noise down: dependency-only bumps don't warrant an entry.
dependencies_update = false

# Unpublished crates (brink, brink-web, zed-brink, brink-test-harness) are
# skipped automatically via their `publish = false` — no per-package overrides
# needed (and zed-brink isn't a workspace member, so an override would error).

# Pinned explicitly (matches the release-plz default) so the release-pr job in
# .github/workflows/release-plz.yml can find the release branch deterministically
# by this exact prefix, rather than depending on a default that could change out
# from under it in a future release-plz upgrade. See the "Refresh
# workspace-excluded lockfiles" step there for why: a workspace version bump
# changes every crates/*/Cargo.toml version, which stales the Cargo.lock of any
# workspace-excluded crate (demos/compound, benchmarks/tools/gen-input,
# benchmarks/drivers/brink-loop) that takes a path dependency on a bumped crate
# — re-reddening demo.yml/benchmarks.yml on the very next PR after a release
# (#1418).
pr_branch_prefix = "release-plz-"
