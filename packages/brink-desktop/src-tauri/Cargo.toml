# The Tauri shell crate for brink-desktop (docs/desktop-shell-spec.md).
#
# DELIBERATELY ITS OWN WORKSPACE (the empty [workspace] table below), per the
# 2026-08-06 ruling: Tauri's dependency graph must not join the root cargo
# workspace, where it would land in every `cargo test --workspace`, every
# wave agent's shared target, and CI's required lanes for zero coverage
# benefit. Versions are therefore managed here, not in the root workspace
# table — the one accepted cost of exclusion.
[package]
name = "brink-desktop"
version = "0.8.0"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8"
# The compiler's own brink.toml discovery/parsing (walk-up rule, #1425
# bound, schema) — the file-anchored open model (ruled 2026-08-23, epic
# #3021) requires the shell to discover a governing config with the SAME
# walk the compiler uses, not a same-directory approximation. A path dep
# into the root workspace's crate tree: versions/lints resolve in THAT
# workspace (this one stays excluded, per the 2026-08-06 ruling above).
brink-project-config = { path = "../../../crates/internal/brink-project-config" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
fontdb = { version = "0.24.0", default-features = false, features = ["fs", "memmap"] }
# OTA bundle updates (docs/desktop-ota-spec.md Stage 2). Every one of these
# was ALREADY in this crate's graph via tauri-plugin-updater — declaring them
# directly adds no new crate, which is also why the archive is `.tar.gz`
# rather than the `.tar.zst` the spec drafted: `zstd` is the one that is not
# here, and it would pull a C toolchain dependency for ~15% off a 10 MB
# download.
#
# ⚠ `minisign-verify` and `base64` must stay in lockstep with what
# tauri-plugin-updater uses: the 2026-09-14 ruling shares ONE keypair across
# both channels, and `signature_is_valid` mirrors that plugin's own parse
# exactly so the two cannot disagree about what a valid signature is.
sha2 = "0.10"
minisign-verify = "0.2"
base64 = "0.22"
tar = "0.4"
flate2 = "1"
semver = "1"
# Already present via tauri-plugin-updater; declared directly for the manifest
# and archive fetch.
#
# ⚠ The feature set is `rustls-no-provider` plus an explicit `rustls`/`ring`,
# copied from what tauri-plugin-updater itself enables, and it is NOT
# interchangeable with reqwest's plain `rustls` feature: that one defaults to
# the aws-lc provider and pulled `aws-lc-sys` (a CMake/C build), `quinn` and
# a dozen others into a graph that had none of them. Measured against this
# lockfile, not assumed — `rustls` and `ring` were already here; aws-lc and
# quinn were not.
#
# The provider is PROCESS-global and the updater plugin installs it lazily,
# only when its own check runs — so a bundle check happening first would find
# none. `install_crypto_provider` in src/lib.rs does the same dance first.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[lib]
name = "brink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The repo-wide lint policy, DUPLICATED rather than inherited (#2415).
#
# `[lints] workspace = true` needs a parent workspace to inherit from, and
# this crate deliberately has none (the empty `[workspace]` table above) —
# so root Cargo.toml's `[workspace.lints]` never reached it, and the
# repo-wide `unwrap_used`/`expect_used`/`panic`/`todo`/`print_*` denies plus
# clippy pedantic had never once been applied here. Keep this table in sync
# with root `Cargo.toml`'s `[workspace.lints]` by hand; the companion
# `clippy.toml` next to this file carries the matching test carve-outs
# (root's own `clippy.toml` is likewise not inherited across the fence).
[lints.rust]
unsafe_code = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"

[lints.clippy]
# Pedantic baseline
pedantic = { level = "warn", priority = -1 }

# Pedantic allows (only what's genuinely noisy/premature)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Cargo group
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

# Restriction lints — cherry-picked for real bug prevention
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
wildcard_dependencies = "deny"
exit = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
rest_pat_in_fully_bound_structs = "warn"
verbose_file_reads = "warn"
allow_attributes = "warn"
