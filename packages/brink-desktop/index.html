<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brink Studio</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        background: #1a1c22;
        color: #c8ccd4;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      #landing {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      #landing button {
        font-size: 15px;
        padding: 10px 22px;
        border-radius: 6px;
        border: 1px solid #3a3f4b;
        background: #262a33;
        color: #c8ccd4;
        cursor: pointer;
      }
      #landing button:hover {
        background: #2e3340;
      }
      #landing .hint {
        font-size: 13px;
        color: #6b7280;
      }
      #landing .recent-projects {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
        width: min(420px, 80vw);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #landing .recent-project {
        width: 100%;
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 4px;
        border: 1px solid transparent;
        background: transparent;
        color: #9aa1ae;
        cursor: pointer;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #landing .recent-project:hover {
        background: #262a33;
        border-color: #3a3f4b;
        color: #c8ccd4;
      }
    </style>
  </head>
  <body>
    <!-- Landing markup is rendered by src/main.tsx (Close Project restores it). -->
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
