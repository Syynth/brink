[workspace]
members = ["crates/brink-*", "crates/brink", "crates/bevy-brink", "crates/internal/*"]
exclude = ["crates/internal/brink-syntax/fuzz", "crates/internal/brink-format/fuzz", "crates/brink-runtime/fuzz", "benchmarks/tools/gen-input", "benchmarks/drivers/brink-loop", "crates/zed-brink", "demos/*"]
resolver = "2"

[workspace.package]
version = "0.0.11"
edition = "2024"
license = "MIT"
repository = "https://github.com/syynth/brink"
readme = "README.md"
keywords = ["ink", "narrative", "compiler", "interactive-fiction"]
categories = ["compilers", "game-development"]

[workspace.lints.rust]
unsafe_code = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"

[workspace.lints.clippy]
# Pedantic baseline
pedantic = { level = "warn", priority = -1 }

# Pedantic allows (only what's genuinely noisy/premature)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Cargo group
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

# Restriction lints — cherry-picked for real bug prevention
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
wildcard_dependencies = "deny"
exit = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
rest_pat_in_fully_bound_structs = "warn"
verbose_file_reads = "warn"
allow_attributes = "warn"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rowan = "0.16.1"
# Query engine for the scripting substrate (#499 ruling, phase 0 slice B).
# Pinned to the 0.27 line (0.x minors are breaking in cargo semantics, so this
# is an effective pin); upgrades are deliberate PRs per the spec's churn risk.
# default-features off: no rayon (single-threaded consumers incl. wasm), no
# accumulators; `macros` only — the same lean set Astral's ty ships to wasm.
salsa = { version = "0.27.2", default-features = false, features = ["macros"] }
bitflags = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# `brink.toml` project settings file (#1005): dialect + type policy.
toml = "0.8"
thiserror = "2"
insta = "1.46.3"
pest = "2"
pest_derive = "2"
proptest = "1"
quick-xml = "0.41.0"
ratatui = "0.30"
divan = "0.1"
icu_locale_core = "2.1"
icu_plurals = "2.1"
smallvec = "1"
bon = "3"
# Portable-regex core for the dialogue-dialect pattern subset (#368): the
# `regex` crate has no lookaround/backreferences, which is exactly the JS
# RegExp ∩ Rust `regex` subset the dialect schema requires.
regex = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# Internal brink crates (versioned for crates.io publish; release-plz keeps these in sync)
bevy-brink-derive = { path = "crates/internal/bevy-brink-derive", version = "0.0.11" }
brink-analyzer = { path = "crates/internal/brink-analyzer", version = "0.0.11" }
brink-codegen-inkb = { path = "crates/internal/brink-codegen-inkb", version = "0.0.11" }
brink-compiler = { path = "crates/brink-compiler", version = "0.0.11" }
brink-db = { path = "crates/internal/brink-db", version = "0.0.11" }
brink-driver = { path = "crates/internal/brink-driver", version = "0.0.11" }
brink-fmt = { path = "crates/internal/brink-fmt", version = "0.0.11" }
brink-format = { path = "crates/internal/brink-format", version = "0.0.11" }
brink-ide = { path = "crates/internal/brink-ide", version = "0.0.11" }
brink-intl = { path = "crates/internal/brink-intl", version = "0.0.11" }
brink-ir = { path = "crates/internal/brink-ir", version = "0.0.11" }
brink-project-config = { path = "crates/internal/brink-project-config", version = "0.0.11" }
brink-runtime = { path = "crates/brink-runtime", version = "0.0.11" }
brink-syntax = { path = "crates/internal/brink-syntax", version = "0.0.11" }
# Unpublished (dev-only): no version, so `cargo publish` strips it from dependents.
brink-test-harness = { path = "crates/internal/brink-test-harness" }
xliff2 = { path = "crates/internal/xliff2", version = "0.0.11" }

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Trigger binary releases via manual workflow_dispatch instead of tag pushes, so
# release-plz's ~20 per-crate tags don't collide with dist (or GitHub's
# 3-tags-per-push limit). Ship binaries from the Actions "Release" → Run workflow.
dispatch-releases = true
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
