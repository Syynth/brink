[workspace]
members = ["crates/brink-*", "crates/brink", "crates/bevy-brink", "crates/internal/*"]
exclude = ["crates/internal/brink-syntax/fuzz", "crates/internal/brink-format/fuzz", "benchmarks/tools/gen-input", "benchmarks/drivers/brink-loop", "crates/zed-brink"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/syynth/brink"
readme = "README.md"
keywords = ["ink", "narrative", "compiler", "interactive-fiction"]
categories = ["compilers", "game-development"]

[workspace.lints.rust]
unsafe_code = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"

[workspace.lints.clippy]
# Pedantic baseline
pedantic = { level = "warn", priority = -1 }

# Pedantic allows (only what's genuinely noisy/premature)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Cargo group
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

# Restriction lints — cherry-picked for real bug prevention
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
wildcard_dependencies = "deny"
exit = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
rest_pat_in_fully_bound_structs = "warn"
verbose_file_reads = "warn"
allow_attributes = "warn"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rowan = "0.16.1"
bitflags = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
insta = "1.46.3"
pest = "2"
pest_derive = "2"
proptest = "1"
quick-xml = "0.37"
ratatui = "0.30"
divan = "0.1"
icu_locale_core = "2.1"
icu_plurals = "2.1"
smallvec = "1"
bon = "3"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# Internal brink crates (versioned for crates.io publish; release-plz keeps these in sync)
bevy-brink-derive = { path = "crates/internal/bevy-brink-derive", version = "0.0.1" }
brink-analyzer = { path = "crates/internal/brink-analyzer", version = "0.0.1" }
brink-codegen-inkb = { path = "crates/internal/brink-codegen-inkb", version = "0.0.1" }
brink-codegen-json = { path = "crates/internal/brink-codegen-json", version = "0.0.1" }
brink-compiler = { path = "crates/brink-compiler", version = "0.0.1" }
brink-converter = { path = "crates/internal/brink-converter", version = "0.0.1" }
brink-db = { path = "crates/internal/brink-db", version = "0.0.1" }
brink-driver = { path = "crates/internal/brink-driver", version = "0.0.1" }
brink-fmt = { path = "crates/internal/brink-fmt", version = "0.0.1" }
brink-format = { path = "crates/internal/brink-format", version = "0.0.1" }
brink-ide = { path = "crates/internal/brink-ide", version = "0.0.1" }
brink-intl = { path = "crates/internal/brink-intl", version = "0.0.1" }
brink-ir = { path = "crates/internal/brink-ir", version = "0.0.1" }
brink-json = { path = "crates/internal/brink-json", version = "0.0.1" }
brink-runtime = { path = "crates/brink-runtime", version = "0.0.1" }
brink-syntax = { path = "crates/internal/brink-syntax", version = "0.0.1" }
# Unpublished (dev-only): no version, so `cargo publish` strips it from dependents.
brink-test-harness = { path = "crates/internal/brink-test-harness" }
xliff2 = { path = "crates/internal/xliff2", version = "0.0.1" }

# cargo-dist / `dist`: prebuilt brink-cli & brink-lsp binaries on GitHub Releases.
# This block is the *input* to `dist init`/`dist generate`. Run `dist init --yes`
# once locally (see docs/releasing.md) to pin `cargo-dist-version` to your
# installed `dist` and to generate `.github/workflows/release.yml`. dist ships
# only the crates that build binaries (brink-cli, brink-lsp); every other
# published crate is a library and is skipped automatically.
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"   # placeholder; `dist init` re-pins to your install
ci = ["github"]
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# PRs only run `dist plan`; the full build matrix runs on tag pushes.
pr-run-mode = "plan"
