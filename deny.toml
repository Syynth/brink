# cargo-deny — supply-chain policy for the dependency graph.
# Run locally with `cargo deny check`.
#
# ⚠ Governs TWO workspaces, not one: the root workspace's `Cargo.lock`
# (enforced, required — `cargo-deny` job in .github/workflows/ci.yml) and
# `packages/brink-desktop/src-tauri`'s excluded `Cargo.lock` (reported,
# non-required — the "cargo-deny (src-tauri)" step in
# .github/workflows/desktop-smoke.yml, #2470). One file so an accepted
# advisory is recorded in exactly one place — but that also means an
# `ignore` entry added for one graph is invisible to the other: it silences
# nothing there and instead prints `warning[advisory-not-detected]` in that
# job's run. This already happens today — RUSTSEC-2026-0192/0194/0195 below
# are root-only ignores, and the src-tauri run reports that warning for all
# three; the reverse will happen the day a src-tauri-only advisory is
# ignored here.

[advisories]
# Fail on any security vulnerability (RUSTSEC). yanked crates are also rejected.
yanked = "deny"
# Known-and-accepted informational advisories (re-evaluate on each bump). These
# are all transitive (pulled in via bevy / wgpu) and not actual vulnerabilities:
ignore = [
    # `ttf-parser` is unmaintained but has no known vulnerability; transitive via the
    # bevy / wgpu font stack. Re-evaluate on the next dep bump.
    "RUSTSEC-2026-0192",
    # quick-xml < 0.41 quadratic run time on hostile XML (duplicate-attribute check /
    # namespace resolution). We only parse local XLIFF translation files, never
    # attacker-controlled input.
    #
    # Re-evaluated on the Bevy 0.19 bump (#416): our direct dep (xliff2 ->
    # quick-xml) is already >= 0.41, but a transitive copy still comes in at
    # 0.39.4 via wayland-scanner (bevy_winit -> winit ->
    # smithay-client-toolkit -> wayland-scanner on Linux/Wayland targets), so
    # this ignore stays until that chain bumps past 0.41 too.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # ── Reached only through harper-core, the prose checker's engine (#3207).
    # Neither is a vulnerability; both are `unmaintained` notices, the same
    # class as ttf-parser above. Verified absent from origin/main's Cargo.lock,
    # so `brink-prose` is exactly what introduced them.
    #
    # bincode 2.0.1 — development ceased permanently (the team considers the
    # crate complete); the advisory itself states "No safe upgrade is
    # available". Path: bincode <- burn-core <- burn <- harper-pos-utils <-
    # harper-brill <- harper-core.
    "RUSTSEC-2025-0141",
    # paste 1.0.15 — a proc-macro, no longer maintained, no known
    # vulnerability. Path: paste <- burn-ndarray <- harper-pos-utils, and
    # directly under harper-core.
    "RUSTSEC-2024-0436",
]

[licenses]
# POLICY: permissive-only by default, PLUS MPL-2.0 admitted for five named
# transitive Tauri dependencies (the `exceptions` table below). That is the
# whole policy — the blanket `allow` list stays permissive-only, so no
# copyleft licence is accepted graph-wide, only per-crate.
#
# This comment used to claim the allowlist was "100% permissive, no copyleft
# obligations". That was true of the ROOT workspace's graph and is still true
# of it, but it was never true of everything this file governs: the
# `packages/brink-desktop/src-tauri` graph has carried MPL-2.0 crates since
# the repo took a Tauri dependency. Corrected with the 2026-08-15 ruling
# below rather than left as a sentence the config contradicts.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "WTFPL",
]
# MPL-2.0 — admitted PER-CRATE. MAINTAINER RULING, 2026-08-15 (see
# docs/decision-log.md "MPL-2.0 admitted for the five transitive Tauri
# dependencies"): these five crates are unavoidable transitively through
# Tauri itself — there is no version bump or feature flag that removes them —
# and MPL-2.0 is file-level copyleft whose obligations attach to modifying
# and distributing those files, which this project links rather than
# modifies.
#
# `exceptions` is the NARROWEST mechanism cargo-deny offers here: adding
# "MPL-2.0" to `allow` above would admit copyleft for every crate in both
# graphs, whereas each entry below admits it for exactly one crate name. Any
# sixth MPL-2.0 crate that appears in either graph still fails the audit,
# which is the point — the ruling covers these five, not the licence.
#
# Verified against the cargo-deny the PINNED action image actually ships
# (0.19.8, EmbarkStudios/cargo-deny-action@bb137d7), not a newer local one:
# the `crate = ...` spelling of an exception is accepted by both 0.19.8 and
# 0.20.2, so this survives the next pin bump either way.
#
# Deliberately NOT version-pinned: the ruling is about these crates' licence,
# not about a Tauri patch release, and a `version` field here would silently
# re-break the audit on every routine bump of the graph they arrive through.
#
# Same shared-file consequence as the `ignore` list above, mirrored: none of
# these five exist in the ROOT graph, so the required root job now prints
# `warning[license-exception-not-encountered]` for all five. Warnings only —
# the root `check` still reports `advisories ok, bans ok, licenses ok,
# sources ok`.
#
# SECOND RULING, 2026-08-28 (see docs/decision-log.md "MPL-2.0 admitted for
# `colored`, reached through Harper"): `colored` joins the list on the same
# per-crate basis but for a DIFFERENT reason, recorded here so the two are not
# read as one precedent. It arrives through a dependency this project CHOSE —
# harper-core, the prose checker's engine (#3207) — not through a framework
# it was already committed to:
#
#     colored <- burn-tensor <- burn-core <- burn <- harper-pos-utils
#             <- harper-brill <- harper-core <- brink-prose
#
# It is a terminal-colouring crate, `optional` in burn-tensor and pulled in
# only by that crate's `std` feature, so it is almost certainly dead code in
# the wasm artifact brink-prose actually ships. There is no feature flag on
# this side that removes it without patching Harper's own dependency tree.
# The licence reasoning is the 2026-08-15 one unchanged: MPL-2.0 is
# file-level copyleft over files this project links and never modifies.
#
# GUARDED BY `deny_toml_admits_mpl_for_the_transitive_tauri_dependencies`
# (packages/brink-desktop/src-tauri/src/lib.rs), which asserts these exact
# six crate names and that "MPL-2.0" stays out of the blanket `allow` list
# above. Edit either list and that test is what fails.
exceptions = [
    # selectors <- dom_query <- tauri-utils, wry
    { crate = "selectors", allow = ["MPL-2.0"] },
    # cssparser <- selectors + dom_query
    { crate = "cssparser", allow = ["MPL-2.0"] },
    # cssparser-macros <- cssparser
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    # dtoa-short <- cssparser
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    # option-ext <- dirs-sys <- dirs <- tauri, tauri-build, wry
    { crate = "option-ext", allow = ["MPL-2.0"] },
    # colored <- burn-tensor <- burn <- harper-pos-utils <- harper-core
    # (2026-08-28 ruling — NOT the Tauri one; see the note above)
    { crate = "colored", allow = ["MPL-2.0"] },
]
# Crates whose license must be confirmed by hand can be pinned here; none needed.
confidence-threshold = 0.9

[bans]
# Surface (don't hard-fail) duplicate versions of the same crate — common and
# mostly unavoidable in a bevy-sized graph, but worth keeping an eye on.
multiple-versions = "warn"
wildcards = "deny"
# Our internal dev-dependencies are intentionally version-less path deps (so
# `cargo publish` strips them); cargo reads those as `*`. Permit wildcards only
# when they're path deps — real registry wildcards are still denied.
allow-wildcard-paths = true

[sources]
# Every dependency must come from crates.io. No git or alternate registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
