name: Book

on:
  push:
    branches: [main]
    # The deploy stages the live embedded playground via `just book-assets`
    # (wasm-pack build crates/brink-web + pnpm build of the studio), so any
    # change to those sources must redeploy — not just docs/book edits. Filter
    # to what actually feeds the build so unrelated merges (README, .github,
    # tools, tests) don't trigger a rebuild. Path filters do source-level change
    # detection *before* the expensive build, which is cheaper than hashing the
    # built wasm/js (that would require building first).
    paths:
      - crates/**
      - packages/**
      - docs/book/**
      - Cargo.toml
      - Cargo.lock
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - justfile
      - rust-toolchain.toml
  # Manual trigger for anything the filter intentionally omits.
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolchain (incl. the wasm32-unknown-unknown target) comes from
      # rust-toolchain.toml, honored automatically by rustup.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: just,wasm-pack
      - run: cargo install mdbook --locked
      - run: just book-assets   # build brink-web wasm + studio app, stage into docs/book/src/playground
      - run: mdbook build docs/book
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book/book
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
