name: Book

on:
  push:
    branches: [main]
    # The deploy stages the live embedded playground via `just book-assets`
    # (wasm-pack build crates/brink-web + pnpm build of the studio), so any
    # change to those sources must redeploy — not just docs/book edits. Filter
    # to what actually feeds the build so unrelated merges (README, .github,
    # tools, tests) don't trigger a rebuild. Path filters do source-level change
    # detection *before* the expensive build, which is cheaper than hashing the
    # built wasm/js (that would require building first).
    paths:
      - crates/**
      - packages/**
      - docs/book/**
      - Cargo.toml
      - Cargo.lock
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - justfile
      - rust-toolchain.toml
  # Manual trigger for anything the filter intentionally omits.
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Hard backstop against the 360-minute Actions default (#2697): wasm +
    # studio build, mdbook build and a Pages deploy — minutes, not hours.
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolchain (incl. the wasm32-unknown-unknown target) comes from
      # rust-toolchain.toml, honored automatically by rustup.
      # No `version:` input on purpose (#2604): with it omitted the action reads
      # root package.json's `packageManager` field, so corepack, this lane and
      # scripts/setup-dev.sh all resolve ONE exact pnpm version. Pinning only a
      # major here made which 10.x a runner got ambient, and the same missing
      # `crates/brink-web/www/pkg` link produced two different failure shapes
      # across that range (#2479/#2492 exit 0 vs #2593/#2596 exit 1).
      # `scripts/check-pnpm-pin.mjs` (via `pnpm test:scripts`) fails if a
      # `version:` input reappears here disagreeing with the pin.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just,wasm-pack
      - run: cargo install mdbook --locked
      - run: just book-assets   # build brink-web wasm + studio app, stage into docs/book/src/playground
      - run: mdbook build docs/book
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/book/book
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
