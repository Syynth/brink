# @claude mention responder — lets maintainers/contributors tag `@claude` in
# an issue or PR (title, body, or comment) to have Claude Code read the
# thread and respond (answer questions, propose a diff, etc.).
#
# INACTIVE UNTIL SETUP: this workflow will not do anything useful until a
# maintainer adds authentication. Either:
#   - Add the `ANTHROPIC_API_KEY` repo secret (Settings -> Secrets and
#     variables -> Actions), or
#   - Follow the OAuth app setup described in the claude-code-action docs
#     (https://github.com/anthropics/claude-code-action) and wire the
#     resulting secrets in place of `anthropic_api_key` below.
# Until one of those is done, runs will fail at the auth step; no other
# workflow in this repo is affected.
name: Claude

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
