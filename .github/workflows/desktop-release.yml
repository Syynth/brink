name: Desktop release

# Official brink-desktop builds (D4, docs/desktop-shell-spec.md).
#
# Tag-triggered on `desktop-v*` — the desktop version is INDEPENDENT of the
# crate/npm release pipelines (ruled 2026-08-22): `tauri.conf.json`'s
# `version` is its source of truth, so the desktop can ship while crates and
# npm move on their own cadence.
#
# ⚠ This is NOT `release.yml`. That file is cargo-dist-generated for the Rust
# crates and is house-rule-forbidden to edit (editing it breaks the release
# `plan` check). This is a separate workflow for a separate artifact.
#
# APPLE signing/notarization is CONDITIONAL on the secrets being present.
# With them absent the build produces working bundles — unsigned, so macOS
# quarantines the download — which is what makes this pipeline testable
# before the Apple credentials exist.
#
# ⚠ That degradation is NOT automatic. An absent secret expands to an empty
# string, and tauri treats an empty `APPLE_SIGNING_IDENTITY` as an identity
# to sign with rather than as "unsigned" — so the empty vars are unset in
# the build step rather than merely declared. Gating the STEPS on the
# secrets is not sufficient; see that step's comment.
#
# ⚠ `TAURI_SIGNING_PRIVATE_KEY` is NOT optional in the same way. Once
# `createUpdaterArtifacts` is on, `tauri build` HARD-FAILS without it
# ("A public key has been found, but no private key" — verified locally,
# not assumed). That is the correct behaviour: an unsigned update payload
# is one no client will ever accept, so failing the build beats shipping a
# release whose update channel silently does nothing.
# Windows ships unsigned by decision (SmartScreen warns until the download
# earns reputation); the same conditional shape means adding a Windows cert
# later is a secrets change, not a rewrite.
#
# The updater is deliberately NOT wired here yet: `tauri-plugin-updater`
# requires a real public key in `tauri.conf.json`, and shipping a placeholder
# would produce an app that advertises updates it can never verify. It lands
# once the signing keypair exists (`tauri signer generate`).

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the matrix but do not create a GitHub Release"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            bundles: app,dmg
            artifact: macos-aarch64
          - label: Linux
            os: ubuntu-latest
            bundles: deb,appimage
            artifact: linux-x86_64
          - label: Windows
            os: windows-latest
            bundles: nsis
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The tag names the version the manifest will ADVERTISE; tauri.conf.json
      # names the version the built binary REPORTS. If they disagree, the
      # result is not a wrong version string — it is an infinite update loop:
      # an installed app sees the newer manifest version, updates, relaunches
      # still reporting the old version, sees the same update again, forever.
      # It would hit every user on every launch, and nothing in the release
      # itself would look wrong.
      #
      # Checked before the matrix builds rather than after, so a mismatch
      # costs seconds instead of three release-mode builds. Only meaningful
      # on a tag — a dispatch run has a branch name, not a version.
      - name: Tag version must match tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#desktop-v}"
          conf_version="$(jq -r .version packages/brink-desktop/src-tauri/tauri.conf.json)"
          if [ "$tag_version" != "$conf_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} declares version ${tag_version}, but" \
                 "packages/brink-desktop/src-tauri/tauri.conf.json declares ${conf_version}." \
                 "Shipping this would put every installed app into a permanent update loop:" \
                 "it would fetch ${tag_version}, relaunch still reporting ${conf_version}," \
                 "and immediately find the same update again. Bump tauri.conf.json (and" \
                 "Cargo.toml / package.json alongside it) to ${tag_version}, or retag."
            exit 1
          fi
          echo "tag and tauri.conf.json agree on ${conf_version}"

      # Same system deps the bundle-smoke lane installs; webkit2gtk + the
      # AppImage tooling are Linux-only.
      - name: Install Linux dependencies (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.14.0

      # The frontend is a `file:` dependency on this output — it must exist
      # BEFORE install, or the link silently fails to resolve (#2479/#2593).
      - name: Build brink-web wasm package
        run: wasm-pack build crates/brink-web --target web --out-dir www/pkg

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install:checked -- --frozen-lockfile

      # Import the Developer ID cert into a throwaway keychain. Skipped
      # wholesale when the secret is absent, which is what lets this workflow
      # run end-to-end before the Apple credentials exist.
      - name: Import Apple signing certificate
        if: matrix.os == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/cert.p12

      # `tauri build` signs when APPLE_SIGNING_IDENTITY is set and notarizes
      # when the App Store Connect API key vars are.
      #
      # ⚠ "Set" is not the same as "non-empty". An ABSENT secret expands to
      # an EMPTY STRING, not to an absent variable, so declaring these in
      # `env:` hands tauri `APPLE_SIGNING_IDENTITY=""` — which it reads as
      # "sign with the identity ''", runs `codesign`, and dies on
      # `: no identity found`. The first dry run failed exactly there, after
      # a full release build: gating the *steps* on the secret is not enough
      # while the *variables* are still injected. They are unset below
      # instead, which is what makes the unsigned path actually reachable.
      - name: Build bundles
        env:
          # Signs the updater payloads. Absent ⇒ payloads ship unsigned and
          # the manifest step fails loudly rather than publishing a release
          # whose update channel no client can verify.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # Passed through the environment rather than interpolated into the
          # script body: a `${{ secrets.* }}` expansion inside `run:` is
          # substituted into the shell SOURCE, so any content that happens to
          # contain shell syntax would be executed rather than written.
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        shell: bash
        run: |
          for var in APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
            if [ -z "${!var}" ]; then
              unset "$var"
            fi
          done

          if [ -n "$APPLE_API_KEY_CONTENT" ]; then
            export APPLE_API_KEY_PATH="${{ github.workspace }}/api-key.p8"
            # Removed even if the build fails or the job is cancelled.
            trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY_PATH"
          fi
          unset APPLE_API_KEY_CONTENT

          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "Apple signing identity present — bundles will be signed."
          else
            echo "No Apple signing identity — bundles will be UNSIGNED (expected until D4 stage 2)."
          fi

          pnpm --filter @brink/desktop exec tauri build --bundles ${{ matrix.bundles }}

      # Fail loudly rather than uploading an empty artifact — the bundle-smoke
      # lane's own lesson (#2709): assert the artifact exists, do not assume
      # a zero exit means a bundle was produced.
      - name: Verify bundles were produced
        shell: bash
        run: |
          dir=packages/brink-desktop/src-tauri/target/release/bundle
          test -d "$dir" || { echo "::error::no bundle directory at $dir"; exit 1; }
          found=$(find "$dir" -type f \( -name '*.dmg' -o -name '*.app' -o -name '*.deb' \
            -o -name '*.AppImage' -o -name '*.exe' \) | wc -l | tr -d ' ')
          echo "bundles found: $found"
          test "$found" -gt 0 || { echo "::error::bundle dir exists but is empty"; exit 1; }
          find "$dir" -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \
            -o -name '*.exe' \) -print

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brink-desktop-${{ matrix.artifact }}
          path: |
            packages/brink-desktop/src-tauri/target/release/bundle/**/*.dmg
            packages/brink-desktop/src-tauri/target/release/bundle/**/*.deb
            packages/brink-desktop/src-tauri/target/release/bundle/**/*.AppImage
            packages/brink-desktop/src-tauri/target/release/bundle/**/*.exe
            packages/brink-desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            packages/brink-desktop/src-tauri/target/release/bundle/**/*.nsis.zip
            packages/brink-desktop/src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Runs for dry runs too: assembling (and printing) the manifest is the
    # single most failure-prone step — the filename→platform-key mapping is
    # unverifiable without real artifacts — so a dry run must exercise it.
    # Only the PUBLISH step is gated on this being a real tag.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      # The manifest the shipped app polls. Built by a TESTED script rather
      # than inline shell: the filename→platform-key mapping fails silently
      # when wrong (the app reports "up to date" forever), and the script
      # refuses to emit an unsigned or empty manifest.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: packages/brink-desktop/scripts
          path: repo
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      # `upload-artifact` stores paths relative to the least-common-ancestor
      # of the globs it matched, so the bundles arrive nested by bundler
      # directory — `nsis/Brink Studio_0.1.0_x64-setup.exe`, `dmg/…`,
      # `appimage/…` (verified by downloading a real artifact from run
      # 32590171387, not inferred). That breaks BOTH consumers below:
      # `readdirSync` is not recursive, so the manifest builder saw only
      # directory names and refused to emit an empty manifest; and
      # `gh release create artifacts/*` would hand `gh` directories rather
      # than files.
      #
      # Flatten once, here, so both steps see what they expect. Release
      # assets are a flat namespace anyway, and the bundler subdirectory is
      # not part of any filename the manifest references.
      - name: Flatten downloaded artifacts
        shell: bash
        run: |
          # Portable form rather than `mv -t` (GNU-only): this job runs on
          # ubuntu today, but the shape is testable on any machine, which is
          # how it got tested. Filenames contain spaces — every expansion
          # here is quoted accordingly.
          find artifacts -mindepth 2 -type f -exec sh -c 'for f do mv -n "$f" artifacts/; done' sh {} +
          find artifacts -mindepth 1 -type d -empty -delete

          # GitHub REWRITES release asset filenames on upload: characters
          # outside [A-Za-z0-9._-] become dots. Every bundle tauri produces
          # here contains a space ("Brink Studio…"), so the asset that lands
          # is `Brink.Studio.app.tar.gz` while the manifest — built from the
          # local filename — pointed at `Brink%20Studio.app.tar.gz`. Every
          # URL in desktop-v0.1.0's manifest returned HTTP 404, and nothing
          # anywhere reported an error: the release looked complete and the
          # update channel was dead on arrival.
          #
          # No dry run could catch this, because a dry run never uploads.
          # So rather than trying to PREDICT GitHub's rewrite in the
          # manifest, the names are normalised HERE, before either consumer
          # sees them — the manifest and the upload then read the same
          # bytes, and there is no second name to drift.
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            n=$(printf '%s' "$b" | tr -c 'A-Za-z0-9._-' '.')
            if [ "$b" != "$n" ]; then
              mv -n "$f" "artifacts/$n"
              echo "normalised: $b -> $n"
            fi
          done

          echo "Artifacts to publish:"
          ls -1 artifacts

      - name: Build latest.json
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          # A dispatch run has a branch name, not a tag, so the strip above
          # leaves it unchanged; the manifest still proves the mapping.
          case "$GITHUB_REF_NAME" in desktop-v*) ;; *) version="0.0.0-dryrun" ;; esac
          node repo/packages/brink-desktop/scripts/build-update-manifest.mjs \
            artifacts "$version" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" artifacts/latest.json
          cat artifacts/latest.json

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/desktop-v') && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq '[.[] | select(.tagName | startswith("desktop-v"))][0].tagName // empty')"

          if [ -n "$prev" ]; then
            echo "Generating notes since the previous desktop release: $prev"
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Brink Studio $GITHUB_REF_NAME" \
              --generate-notes \
              --notes-start-tag "$prev" \
              artifacts/*
          else
            echo "No previous desktop-v* release — writing first-release notes."
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Brink Studio $GITHUB_REF_NAME" \
              --notes "First release of the Brink Studio desktop app.

          Not yet signed or notarized, so macOS and Windows will both warn on
          first launch. On macOS: System Settings -> Privacy & Security ->
          Open Anyway.

          Downloads: \`.dmg\` (macOS), \`.AppImage\` or \`.deb\` (Linux),
          \`.exe\` (Windows). The \`.app.tar.gz\`/\`.nsis.zip\` files and their
          \`.sig\` companions are update payloads for the in-app updater, not
          downloads." \
              artifacts/*
          fi


      # `--generate-notes` alone diffs against the repo's PREVIOUS RELEASE,
      # whichever train produced it. This repo runs three, and the npm and
      # crates trains publish far more often than desktop — so the notes for
      # a desktop release would cover every PR since some `@brink-lang/*`
      # publish, nearly all of it compiler and editor work that shipped
      # nothing to this app. At the time of writing that diff was 500+ PRs
      # back to `@brink-lang/studio@0.14.0`.
      #
      # This is the same mistake as pointing the updater at
      # `releases/latest` (see the endpoint comment above): assuming one
      # release train. `--notes-start-tag` pins the diff to the previous
      # DESKTOP release, so an npm publish landing between two desktop
      # releases cannot widen it. The first desktop release has no
      # predecessor to diff from, so it gets written notes instead.
      # The manifest can name a file that does not exist at the URL it
      # claims, and nothing about the release will look wrong — that is
      # exactly what desktop-v0.1.0 shipped: three URLs, three 404s, a
      # green run, and an update channel that was dead the moment it
      # published. A manifest is only correct if the things it points at
      # can actually be fetched, so fetch them.
      #
      # Runs after the release exists (the assets have to be uploaded to be
      # resolvable) and before the alias is updated, so a broken manifest
      # never becomes the one clients poll.
      # The shipped app polls a FIXED url, so the manifest must live at a
      # stable address. It cannot be `releases/latest/...`: GitHub's "latest"
      # is the newest release in the WHOLE repo, and this repo's npm and
      # crates trains publish far more often than desktop does — the first
      # `@brink-lang/*` release after a desktop one would take that url to a
      # release with no latest.json in it. Tauri reads a 404 as "no update
      # available", so the update channel would die silently and stay dead.
      # (Checked, not theorised: `releases/latest` resolves to
      # `@brink-lang/studio@0.14.0` today.)
      #
      # `desktop-latest` is a permanent alias release holding only the
      # manifest, re-uploaded on every desktop release. `--latest=false`
      # keeps it from displacing the real "Latest" badge, and it carries no
      # binaries — those stay on the versioned `desktop-v*` release the
      # manifest points into.
      # The manifest can name a file that does not exist at the URL it
      # claims, and nothing about the release will look wrong — that is
      # exactly what desktop-v0.1.0 shipped: three URLs, three 404s, a
      # green run, and an update channel that was dead the moment it
      # published. A manifest is only correct if the things it points at
      # can actually be fetched, so fetch them.
      #
      # Runs after the release exists (the assets have to be uploaded to be
      # resolvable) and before the alias is updated, so a broken manifest
      # never becomes the one clients poll.

      # The shipped app polls a FIXED url, so the manifest must live at a
      # stable address. It cannot be `releases/latest/...`: GitHub's "latest"
      # is the newest release in the WHOLE repo, and this repo's npm and
      # crates trains publish far more often than desktop does — the first
      # `@brink-lang/*` release after a desktop one would take that url to a
      # release with no latest.json in it. Tauri reads a 404 as "no update
      # available", so the update channel would die silently and stay dead.
      # (Checked, not theorised: `releases/latest` resolves to
      # `@brink-lang/studio@0.14.0` today.)
      #
      # `desktop-latest` is a permanent alias release holding only the
      # manifest, re-uploaded on every desktop release. `--latest=false`
      # keeps it from displacing the real "Latest" badge, and it carries no
      # binaries — those stay on the versioned `desktop-v*` release the
      # manifest points into.
      - name: Verify every manifest URL resolves
        if: startsWith(github.ref, 'refs/tags/desktop-v') && !inputs.dry_run
        shell: bash
        run: |
          fail=0
          while read -r url; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -IL "$url")
            if [ "$code" = "200" ]; then
              echo "  ok   $url"
            else
              echo "::error::manifest URL returned HTTP $code (expected 200): $url"
              fail=1
            fi
          done < <(jq -r '.platforms[].url' artifacts/latest.json)
          if [ "$fail" -ne 0 ]; then
            echo "::error::the update manifest points at assets that cannot be fetched." \
                 "Clients would be offered an update they cannot download, or told they" \
                 "are up to date forever. The alias has NOT been updated, so the" \
                 "previously published manifest is still the live one."
            exit 1
          fi

      - name: Publish the manifest to the desktop-latest alias
        if: startsWith(github.ref, 'refs/tags/desktop-v') && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create desktop-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Desktop update manifest" \
              --notes "Update manifest the Brink Studio desktop app polls. Points at the newest desktop-v* release; not a download." \
              --latest=false
          gh release upload desktop-latest artifacts/latest.json \
            --repo "$GITHUB_REPOSITORY" --clobber