name: Demo (compound)

on:
  schedule:
    # Weekly schedule: Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

# Least privilege: jobs only read the repo. Grant more per-job if ever needed.
permissions: {}

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to full commit SHAs (mutable tags can be
# repointed at malicious code). The trailing comment tracks the version;
# Dependabot bumps both together.
jobs:
  demo-gate:
    name: DEMO_GATE
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # bevy-brink's `bevy` dev-dependency (windowed `play_story` example) pulls
      # in wayland-sys/winit/alsa, whose build scripts need these system libs.
      # The demo's `cargo test` compiles examples, so they're required here.
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Format check inside demos/compound
      - name: Format check (demos/compound)
        working-directory: demos/compound
        run: cargo fmt --all -- --check
      # Clippy inside demos/compound
      - name: Clippy (demos/compound)
        working-directory: demos/compound
        run: cargo clippy --all-targets -- -D warnings
      # Test inside demos/compound
      - name: Test (demos/compound)
        working-directory: demos/compound
        run: cargo test
      # Verify the demo stays excluded from the workspace: root cargo check
      # must not build the demo
      - name: Check (root workspace)
        run: cargo check --workspace
