name: Demo (compound)

on:
  schedule:
    # Weekly schedule: Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
  # pull_request trigger REMOVED (maintainer, 2026-08-24, during the perf
  # stack merge): the demo gate held up a merge one time too many for the
  # signal it provides on PRs. The weekly schedule + manual dispatch remain
  # the demo's health check; a PR-relevant break now surfaces on the next
  # scheduled run instead of the PR. (Advisory-only either way — it was
  # never in branch protection's required-checks list.)

jobs:
  demo-gate:
    name: DEMO_GATE
    runs-on: ubuntu-latest
    # Hard backstop against the 360-minute Actions default (#2697): fmt +
    # clippy + test + workspace-exclusion check of one satellite crate.
    # 35, not 20 (#3028): a COLD-cache build of the demo's Bevy tree takes
    # longer than 20 minutes, and a timed-out run saves no cache — so once
    # the cache was evicted, every run cold-started, hit the cap, and
    # discarded its progress. 20 minutes was fine warm and unreachable
    # cold; 35 lets one cold run finish and re-warm the cache.
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # bevy-brink's `bevy` dev-dependency (windowed `play_story` example) pulls
      # in wayland-sys/winit/alsa, whose build scripts need these system libs.
      # The demo's `cargo test` compiles examples, so they're required here.
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Save the cache even when a later step fails or times out
          # (#3028): without this, a run that dies mid-build discards all
          # compilation progress, so a cold cache can never converge back
          # to warm across runs — the second half of the self-sustaining
          # cold loop the timeout bump above breaks.
          cache-on-failure: true
      # Format check inside demos/compound
      - name: Format check (demos/compound)
        working-directory: demos/compound
        run: cargo fmt --all -- --check
      # Clippy inside demos/compound. `--locked` is load-bearing: without it
      # a stale demos/compound/Cargo.lock (e.g. after a brink crate's deps
      # change) is silently refreshed by cargo and the job exits 0, which is
      # exactly how the drift this gate exists to catch went unnoticed
      # before. Every PR that changes a brink crate's dependency set must
      # now also refresh this lockfile, or this step fails.
      - name: Clippy (demos/compound)
        working-directory: demos/compound
        run: cargo clippy --locked --all-targets -- -D warnings
      # Test inside demos/compound
      - name: Test (demos/compound)
        working-directory: demos/compound
        run: cargo test --locked
      # Verify the demo stays excluded from the workspace: root cargo check
      # must not build the demo
      - name: Check (root workspace)
        run: cargo check --workspace
