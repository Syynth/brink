name: Demo (compound)

on:
  schedule:
    # Weekly schedule: Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
  # demos/compound is workspace-excluded (see its Cargo.toml) and gets zero
  # signal from the main `ci.yml` gate (#1386). Path-filtered so it only
  # fires on pushes/PRs that could actually affect it, keeping it off the
  # critical path for every other PR (#1077, decision 2026-07-22 / #1237).
  # Not in branch protection's required-checks list, so it's advisory: it
  # goes red on a relevant PR but does not block the merge by itself.
  # `crates/internal/**` is included alongside `crates/brink-*/**`: the demo's
  # Cargo.lock pins several crates/internal/* packages transitively (e.g.
  # brink-analyzer, brink-ir, brink-syntax), so a change there can stale the
  # lockfile exactly like a change to a front-door crate (#1402 — DEMO_GATE
  # went red only after merge because this filter missed that). Root
  # `Cargo.toml` is included too: it holds `[workspace.package] version` and
  # `[workspace.dependencies]`, which every brink package version and
  # transitive dep in demos/compound/Cargo.lock resolves from, so a bump
  # there is the same staling vector one directory up.
  pull_request:
    paths:
      - 'demos/**'
      - 'crates/bevy-brink/**'
      - 'crates/brink-*/**'
      - 'crates/internal/**'
      - 'Cargo.toml'
      - '.github/workflows/demo.yml'
  push:
    branches: [main]
    paths:
      - 'demos/**'
      - 'crates/bevy-brink/**'
      - 'crates/brink-*/**'
      - 'crates/internal/**'
      - 'Cargo.toml'
      - '.github/workflows/demo.yml'

# Least privilege: jobs only read the repo. Grant more per-job if ever needed.
permissions: {}

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to full commit SHAs (mutable tags can be
# repointed at malicious code). The trailing comment tracks the version;
# Dependabot bumps both together.
jobs:
  demo-gate:
    name: DEMO_GATE
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bevy-brink's `bevy` dev-dependency (windowed `play_story` example) pulls
      # in wayland-sys/winit/alsa, whose build scripts need these system libs.
      # The demo's `cargo test` compiles examples, so they're required here.
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      # Format check inside demos/compound
      - name: Format check (demos/compound)
        working-directory: demos/compound
        run: cargo fmt --all -- --check
      # Clippy inside demos/compound. `--locked` is load-bearing: without it
      # a stale demos/compound/Cargo.lock (e.g. after a brink crate's deps
      # change) is silently refreshed by cargo and the job exits 0, which is
      # exactly how the drift this gate exists to catch went unnoticed
      # before. Every PR that changes a brink crate's dependency set must
      # now also refresh this lockfile, or this step fails.
      - name: Clippy (demos/compound)
        working-directory: demos/compound
        run: cargo clippy --locked --all-targets -- -D warnings
      # Test inside demos/compound
      - name: Test (demos/compound)
        working-directory: demos/compound
        run: cargo test --locked
      # Verify the demo stays excluded from the workspace: root cargo check
      # must not build the demo
      - name: Check (root workspace)
        run: cargo check --workspace
