name: Desktop smoke

# NON-REQUIRED by design (#2402, docs/desktop-shell-spec.md "Workspace
# placement"): "CI in v1: none required. A non-required smoke job (`cargo
# check` the shell crate + `pnpm build` the package) may be added if drift
# appears. The required lanes must not grow a Tauri build." #2346's ruled
# fence is the same: no REQUIRED CI lane grows a Tauri build. This job must
# never be added to branch protection's required-checks list — that would
# contradict both rulings. It exists purely so `packages/brink-desktop`
# (including `src-tauri`, excluded from the root cargo workspace) stops
# drifting invisibly, the way its rustfmt config did until #2402 found it.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/brink-desktop/**"
      - "packages/ink-editor/**"
      - "packages/brink-studio/**"
      - "packages/wasm/**"
      - "packages/wasm-types/**"
      - "packages/ink-operations/**"
      - "packages/studio-shell/**"
      - "packages/studio-store/**"
      - "packages/studio-ui/**"
      - "crates/brink-web/**"
      - ".github/workflows/desktop-smoke.yml"
      # `crates/brink-cli/**` deliberately does NOT appear above (#2477).
      # It used to belong here because this lane once built the sidecar from
      # source; since #2469's `BRINK_SIDECAR_STUB` (below), the "Stage
      # brink-cli sidecar" step and its nested re-run from `pnpm build` both
      # write a placeholder without ever reading brink-cli source, and
      # src-tauri (its own excluded workspace) never depended on the crate
      # either — so nothing left in this lane can notice a brink-cli source
      # change. Watching the tree here would only trigger the job for a
      # change it can no longer detect.
      # `desktop_smoke_path_filter_covers_its_shared_inputs` in
      # src-tauri/src/lib.rs asserts the entry stays gone.
      #
      # Inputs outside those trees that still break this job (#2418 gap 2).
      # Without them a breaking change runs this lane only on the post-merge
      # push to `main`, after the break has landed: the lockfile feeds
      # `pnpm install --frozen-lockfile`; the toolchain pin still selects the
      # rustc this lane's `cargo check`/`clippy`/`test` run under (it used to
      # also feed the cross-workspace `brink-cli` sidecar build, which
      # `BRINK_SIDECAR_STUB` removed — #2469); root `Cargo.toml`/`Cargo.lock`
      # also feed the root-workspace `cargo build` behind `wasm-pack build
      # crates/brink-web` in "Build brink-web wasm package" below — that
      # step is not covered just because src-tauri's own comparison tests
      # are. `Cargo.toml`/`clippy.toml` are additionally what src-tauri's
      # two `*_matches_the_root_workspace` tests compare its copies against
      # (#2415/#2422), which otherwise cannot fail the PR that causes the
      # drift; `Cargo.lock` is additionally a test input in its own right —
      # `dependency_versions_track_the_root_workspace` (#2451) compares it
      # against src-tauri's own lock; and `ci.yml` is the desktop unit
      # suite's only home, asserted by
      # `ci_workflow_still_runs_the_desktop_vitest_suite` below. `ci.yml`
      # and this file are also named individually below because the two
      # tests above check for those exact literal path entries; the glob
      # is additional (#2504): naming only `ci.yml` and this file left
      # `npm-release.yml`, and any brand-new workflow file, free to reorder
      # or add a `pnpm install --frozen-lockfile` lane without ever
      # triggering this lane on the PR that did it —
      # `every_pnpm_install_lane_builds_wasm_first_in_the_same_job`
      # (src-tauri/src/lib.rs) would still catch the regression on the
      # next push to `main`, but only after it had already merged.
      # `deny.toml` is BOTH the licence/advisory policy the `cargo-deny
      # (src-tauri)` step below resolves via cargo-deny's `<cwd>/deny.toml`
      # fallback, AND a test input in its own right:
      # `deny_toml_admits_mpl_for_the_transitive_tauri_dependencies` reads it
      # directly. Without this entry a PR that deletes an `exceptions` entry
      # or adds a sixth MPL crate — touching nothing else — never triggers
      # this lane, so that guard fires only on the post-merge push to `main`,
      # where nothing blocks. Same #2418 gap-2 class as the entries below.
      - "deny.toml"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/**"

permissions: {}

concurrency:
  group: desktop-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Same rationale as ci.yml: every job here starts from a cold checkout, so
  # incremental compilation is pure write overhead, never read back.
  CARGO_INCREMENTAL: 0
  # The `brink-cli` sidecar is staged here only so `tauri-build`'s externalBin
  # resolution finds a file on disk (see "Stage brink-cli sidecar" below);
  # nothing in this check-only lane ever EXECUTES it — `run_cli` in
  # src-tauri/src/lib.rs is the only caller and it needs a running app, not a
  # `cargo test` — so building it at all was pure waste (#2418 gap 4). This
  # asks `ensure-cli-sidecar.mjs` for a stub instead (#2469): it writes a
  # loudly-failing placeholder under the same triple-suffixed name and skips
  # `cargo build -p brink-cli --release` entirely, removing that waste
  # outright.
  #
  # This replaces PR #2446's `CARGO_PROFILE_RELEASE_OPT_LEVEL`/`_DEBUG`/
  # `_CODEGEN_UNITS` stopgap — but that stopgap was job-wide, not scoped to
  # the sidecar build, so it was also flattening the "Build brink-web wasm
  # package" step's `wasm-pack build` below (release by default with no
  # `--dev`/`--profiling`, and this lane's largest build). Removing the vars
  # un-flattens that build too: the lane now deliberately accepts a
  # fully-optimised `wasm-pack build`, rather than keep vars around that
  # would be dead configuration for the sidecar build they were written for
  # once that build is gone, while still quietly de-optimising the wasm one.
  #
  # ⚠ #2482 proposed treating that wasm-pack build the same way as the
  # sidecar above ("still pays for a wasm-pack --release build it never
  # executes"). That is NOT the same shape: the sidecar's staged file only
  # had to EXIST (its content is never read — a placeholder satisfies
  # `externalBin` resolution just as well as a real binary), whereas the
  # "Build brink-web wasm package" step's output is genuinely consumed
  # below — "Typecheck (tsc --noEmit)" resolves the `brink-web` alias into
  # it, and `pnpm build` bundles it — so a stub cannot stand in for it.
  # That leaves #2482's other candidate open: reusing `ci.yml`'s own wasm
  # artefact instead of rebuilding it here. This trace does not answer that
  # one — `ci.yml` has no `upload-artifact`/`download-artifact` step
  # anywhere, so reuse would mean adding one, not something "the content is
  # consumed" settles. See #2482 for the still-open optimisation-level and
  # artefact-reuse questions.
  #
  # An `env:` var rather than a flag on the step below, because the lane runs
  # the script TWICE: its own "Stage brink-cli sidecar" step, and `pnpm build`,
  # which re-runs it. Only the environment reaches the nested invocation.
  # Scoped to this workflow, so `ensure-cli-sidecar.mjs` still builds a real
  # release binary everywhere else, including `pnpm --filter @brink/desktop
  # build` on a developer machine, where the sidecar does get shipped and run.
  #
  # ⚠ `desktop_smoke_stubs_the_staged_sidecar` (src-tauri/src/lib.rs) asserts
  # both halves: this var present, and the #2446 stopgap vars absent.
  BRINK_SIDECAR_STUB: "1"

jobs:
  desktop-smoke:
    name: Desktop smoke (check, clippy, tsc, build)
    runs-on: ubuntu-latest
    # Two heavy builds (wasm-pack and the Tauri graph — the brink-cli release
    # build is stubbed out by BRINK_SIDECAR_STUB above) in a lane branch
    # protection does NOT watch — a hang would burn the 6h default unnoticed.
    # ci.yml sets the same kind of backstop on its long poles (fuzz: 30,
    # determinism-law: 10).
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        id: checkout
        with:
          persist-credentials: false

      # src-tauri links webkit2gtk/gdk/appindicator on Linux; without these
      # dev packages, even `cargo check` fails in gdk-sys's build script
      # before a single line of the crate itself is checked.
      - name: Install Linux dependencies (Tauri)
        id: linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev patchelf

      # Caches BOTH the root workspace (brink-cli, below) and src-tauri's own
      # excluded workspace — rust-cache keys per Cargo.lock location, so one
      # action instance covers both without stepping on each other.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            .
            packages/brink-desktop/src-tauri

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.14.0

      # The @brink-lang/web package is a file: dependency on this output
      # (mirrors the `frontend` job in ci.yml), and src-tauri's own build
      # never touches it — but `pnpm build` below resolves the desktop
      # package's "brink-web" alias straight to this path. It must precede
      # "Install dependencies" below (#2479);
      # `every_pnpm_install_lane_builds_wasm_first_in_the_same_job`
      # (packages/brink-desktop/src-tauri/src/lib.rs, #2504) enforces that ordering.
      - name: Build brink-web wasm package
        id: wasm_build
        run: wasm-pack build crates/brink-web --target web --out-dir www/pkg

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        id: pnpm_install
        run: pnpm install --frozen-lockfile

      # `pnpm install --frozen-lockfile` exits 0 even when the `file:` link
      # above silently failed to resolve (#2479) — `steps.pnpm_install.outcome`
      # alone cannot tell the difference, since the step's own exit code is
      # the lying signal #2479 named. This step checks the ACTUAL resolved
      # result (`scripts/check-wasm-pkg.mjs`'s `checkWasmPkgLink`, #2514,
      # follow-up to #2504's item 2 / PR #2509's adversarial review "Scope
      # gaps" item 2) so "Typecheck"/"pnpm build" below can gate on THIS
      # step's outcome instead of trusting the install's raw outcome. Same
      # script ci.yml's `frontend`/`e2e` jobs run as `pnpm run check:wasm-pkg`
      # right after their own installs (#2504's first bullet).
      - name: Verify wasm package link (check-wasm-pkg)
        id: check_wasm_pkg
        if: "!cancelled() && steps.pnpm_install.outcome == 'success'"
        run: pnpm run check:wasm-pkg

      # Stages the brink-cli sidecar that src-tauri's build.rs requires to
      # exist on disk before it will even `cargo check` — externalBin resource
      # resolution runs unconditionally, not only on `tauri build`
      # (packages/brink-desktop/scripts/ensure-cli-sidecar.mjs). `BRINK_SIDECAR_STUB`
      # in this workflow's `env:` block makes that a placeholder rather than a
      # root-workspace release build (#2469).
      - name: Stage brink-cli sidecar
        id: sidecar
        run: node scripts/ensure-cli-sidecar.mjs
        working-directory: packages/brink-desktop

      # src-tauri is its OWN cargo workspace (excluded from root, per
      # docs/desktop-shell-spec.md "Workspace placement") — every cargo
      # command below runs with cwd inside it, never from the repo root.
      #
      # ⚠ `--locked` on every cargo command below is load-bearing, not style:
      # packages/brink-desktop/src-tauri/Cargo.lock is committed but has no
      # staleness gate anywhere in CI. Without --locked, cargo silently
      # refreshes a stale lock in-job and the run still exits 0 — the exact
      # drift class this whole workflow exists to close. ci.yml already gates
      # this for the repo's other workspace-excluded crates with committed
      # lockfiles ("Verify fuzz crate lockfiles are not stale", #1396 gap 2 /
      # #1386), and the JS half of this same job already uses
      # `pnpm install --frozen-lockfile`. If --locked turns this lane red, that
      # failure IS the drift: commit the refreshed lock.
      # ⚠ Every check below is deliberately non-blocking for its SIBLINGS —
      # a clippy failure must not hide a failing test — but each one is
      # gated on the SETUP steps it actually needs (2026-08-13 finding, in
      # neither issue body). A bare `!cancelled()` overrides the implicit
      # `success()` for a failed prerequisite too, so a dying
      # `pnpm/action-setup` used to let four dependent steps run and fail
      # for the same reason, burying the root cause under cascade noise.
      # `outcome` (not `conclusion`) is the right field: a prerequisite that
      # was itself SKIPPED because something before it failed reports
      # `skipped`, and its dependants must skip too.
      #
      # Format check needs nothing but the toolchain the runner ships and
      # the checkout — but it does need the checkout: `actions/checkout`
      # has no `id` on the other steps to gate on, yet without a working
      # tree "Format check"'s `working-directory` does not exist either, so
      # a failed checkout used to still fire this step and die on a
      # working-directory error stacked on top of the real failure — the
      # last residue of the cascade class this file otherwise closes.
      - name: Format check (src-tauri)
        if: "!cancelled() && steps.checkout.outcome == 'success'"
        run: cargo fmt --all -- --check
        working-directory: packages/brink-desktop/src-tauri

      # Supply-chain gate for THIS workspace's graph (#2470). ci.yml's
      # `cargo-deny` job runs `check` exactly once, at the repo root, and the
      # root `Cargo.lock` shares no resolution with this one — so until this
      # step existed, src-tauri's own lock (451 `[[package]]` entries via the
      # Tauri graph) got no RUSTSEC advisory check and no licence check
      # anywhere in CI. #2451's `dependency_versions_track_the_root_workspace`
      # covers a different hole across the same fence: version drift, not
      # audit coverage.
      #
      # WHY HERE and not in ci.yml's required `cargo-deny` job: this audit
      # cannot be a blocking gate yet. Its first run surfaced 22 real errors.
      # The 2026-08-15 maintainer ruling (docs/decision-log.md, "MPL-2.0
      # admitted for the five transitive Tauri dependencies") cleared the 5
      # MPL-2.0 `error[rejected]` findings — cssparser, cssparser-macros,
      # dtoa-short, option-ext, selectors are now admitted per-crate by
      # deny.toml's `[licenses] exceptions` — leaving 17: 16 unmaintained-crate
      # advisories inherent to Tauri v2 on Linux (RUSTSEC-2024-0411..0420
      # gtk-rs GTK3 bindings, RUSTSEC-2024-0370 proc-macro-error,
      # RUSTSEC-2025-0075/0080/0081/0098/0100 unic-* via urlpattern ->
      # tauri-utils; all "no safe upgrade available"), plus one
      # `error[unlicensed]` for brink-desktop itself. NEITHER of those two
      # classes is ruled on — the ruling was about the licences of those five
      # crates and nothing else. Accepting either is a maintainer policy call,
      # not one this step may make with a blanket ignore — so it still REPORTS
      # (`continue-on-error`) rather than blocks, and a
      # non-blocking step in the required job would pay the "required lanes
      # must not grow a Tauri build" question (#2402/#2346) for exactly zero
      # blocking power. Promote it to ci.yml once those findings are ruled on.
      # `on: push: branches: [main]` above carries no path filter, so every
      # merge to `main` re-runs this audit against a freshening advisory DB.
      #
      # It resolves the Tauri graph's METADATA only (~2s locally) — no
      # compilation, no webkit2gtk system deps — so it is deliberately gated
      # on the checkout alone, like the format check above.
      - name: cargo-deny (src-tauri)
        if: "!cancelled() && steps.checkout.outcome == 'success'"
        continue-on-error: true
        # ⚠ The bundled image's cargo-deny version is mirrored by
        # `CARGO_DENY_VERSION` in scripts/setup-dev.sh (#2498). Bumping this
        # SHA changes that version — update the script in the same PR, or a
        # local audit silently disagrees with this job.
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check
          manifest-path: ./packages/brink-desktop/src-tauri/Cargo.toml
          # `arguments` replaces the action's own `--all-features` default
          # wholesale, so it has to carry that back; `--locked` is this
          # lane's standing convention for every command reading the
          # committed lock (see the block above the cargo steps below).
          # No `--config`: the pinned action's image ships cargo-deny
          # 0.19.8, where `--config` is a `check` SUBCOMMAND flag, not a
          # top-level one — and `action.yml` places `arguments` BEFORE
          # `command` on the assembled command line, so passing it here is
          # a clap parse failure (`error: unexpected argument '--config'
          # found`, exit 2) that `continue-on-error` silently swallows.
          # cargo-deny's own `<cwd>/deny.toml` fallback already resolves to
          # the root policy without the flag, because the entrypoint's only
          # `cd` is subshelled and leaves cwd at the workspace root. Which
          # flags are legal in `arguments` vs `command-arguments` is a
          # function of the cargo-deny version baked into the pinned image
          # — re-check this comment on the next SHA bump.
          arguments: --all-features --locked

      - name: cargo check (src-tauri)
        if: "!cancelled() && steps.linux_deps.outcome == 'success' && steps.sidecar.outcome == 'success'"
        run: cargo check --locked --all-targets
        working-directory: packages/brink-desktop/src-tauri

      - name: Clippy (src-tauri)
        if: "!cancelled() && steps.linux_deps.outcome == 'success' && steps.sidecar.outcome == 'success'"
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: packages/brink-desktop/src-tauri

      - name: cargo test (src-tauri)
        if: "!cancelled() && steps.linux_deps.outcome == 'success' && steps.sidecar.outcome == 'success'"
        run: cargo test --locked
        working-directory: packages/brink-desktop/src-tauri

      # `tsc` resolves the "brink-web" alias into the wasm-pack output
      # THROUGH node_modules, so this needs the resolved link (#2514) to
      # have actually verified, not merely `pnpm install`'s own (unreliable,
      # #2479) exit code.
      - name: Typecheck (tsc --noEmit)
        if: "!cancelled() && steps.wasm_build.outcome == 'success' && steps.check_wasm_pkg.outcome == 'success'"
        run: pnpm --filter @brink/desktop typecheck

      # `pnpm build` re-runs ensure-cli-sidecar.mjs, so it inherits the
      # sidecar step's prerequisites on top of the frontend ones.
      - name: pnpm build
        if: "!cancelled() && steps.wasm_build.outcome == 'success' && steps.check_wasm_pkg.outcome == 'success' && steps.sidecar.outcome == 'success'"
        run: pnpm --filter @brink/desktop build
