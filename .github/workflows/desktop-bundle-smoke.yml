name: Desktop bundle smoke

# NON-REQUIRED by design (#2346/#2402's ruled fence: no REQUIRED CI lane may
# grow a Tauri build) — mirrors desktop-smoke.yml's own non-required
# standing. This job must never be added to branch protection's
# required-checks list.
#
# #2709: `docs/desktop-shell-spec.md` had named "a real `tauri build --debug
# --bundles deb` lane" as the standing follow-up across three separate
# issues without any of them filing it —
#   - #2687 (magic-byte sidecar check): exercised only against synthetic
#     byte arrays in unit tests, never a real cross-built binary.
#   - #2691 (bundle-time sidecar assertion / `assert-real-sidecar.mjs`):
#     same gap — its firing point was only OBSERVED by a by-hand
#     `pnpm tauri build --debug --bundles deb` (docs/desktop-shell-spec.md
#     "Bundle-time sidecar assertion"), not by any CI lane.
#   - #2699 / PR #2704 (`--version` smoke check): its host-triple-match
#     execute branch — the one that actually runs the staged binary — is
#     likewise proven only by unit tests with a mocked `runFile`, plus that
#     same by-hand drive.
# This lane makes that by-hand observation continuous: it runs a real
# `tauri build --debug --bundles deb` end to end, on a real cross-workspace
# `brink-cli` release build (unlike desktop-smoke.yml, which stubs the
# sidecar via BRINK_SIDECAR_STUB because nothing there ever executes it), so
# the magic check, the `--version` smoke check's execute branch, and the ELF
# staging path are all exercised against real bytes at least once per
# relevant change, not only against synthetic fixtures.
#
# `deb` on `ubuntu-latest`, not a macOS/Windows target: it is the cheapest
# real bundle target this repo's CI already has the runner class and system
# deps for (desktop-smoke.yml's own Linux dependency list, reused below).
# Whether to also cover macho/pe bundles is the same unsettled
# runner-cost question `docs/desktop-shell-spec.md` "CI coverage blind
# spots" already declines to rule on for the file-association surface — not
# decided here either.
#
# ⚠ Deliberately NOT `--locked`, unlike desktop-smoke.yml's own cargo steps:
# this lane's cargo builds (the root workspace's `cargo build -p brink-cli
# --release` via ensure-cli-sidecar.mjs, and src-tauri's own debug build,
# both driven through `pnpm tauri build`) have no plumbed passthrough for
# extra cargo flags on this Tauri CLI version. This lane is NOT the
# lock-staleness gate for `packages/brink-desktop/src-tauri/Cargo.lock` —
# desktop-smoke.yml's `--locked` cargo steps (see its own ⚠ block) remain
# the lane that catches that lockfile drifting stale; this one only proves
# the bundle builds and runs.
# #2716: the `push` trigger below used to have NO `paths:` filter, unlike
# `pull_request`'s (below) — every push to `main` re-ran this lane (a real
# `cargo build -p brink-cli --release` plus the full `src-tauri` Tauri build
# graph) and re-saved its rust-cache entry, no matter what the push touched.
# Verified against a real run (job 95324823667, 2026-08-17, a cache HIT so
# no upload, but the entry it restored is the same one a change to these
# paths would re-save): `Cache Size: ~784 MB (822197295 B)` — matches the
# ~822 MB figure #2716 reported. Against ci.yml's 10 GB repo-wide cache
# quota (shared across ~11 separate rust-cache keys today, several with
# their own `shared-key`), GitHub LRU-evicts beyond quota — the failure
# mode is another lane's cache silently getting evicted and that lane
# going cold on its next run, not a visible error anywhere.
#
# Fix chosen: mirror `pull_request`'s own `paths:` list onto `push` too
# (below) rather than touch the cache key or its content. Trade-off, stated
# plainly: a push to `main` whose commit touches NONE of these paths no
# longer re-runs this lane or re-saves its ~784 MB cache entry — but such a
# push could not have changed this lane's output either, so nothing real is
# lost, and `pull_request` already worked this way before this change.
# Restricting to `pull_request`-only (dropping `push` entirely) was
# considered and rejected: a direct push to `main` that DOES touch these
# paths (no PR, or a squash-merge whose base diverged from what its PR
# lane actually ran against) would then go fully unverified by this lane
# until the next matching change — the exact real-build coverage this lane
# exists to buy, and gutting it risks the lane being disabled later for
# looking useless. Narrowing the cache key itself was also considered and
# rejected here: the two workspaces cached (root + `src-tauri`) are both
# genuinely large, real build graphs this lane needs warm to stay fast, and
# shrinking what's cached without a push-path filter to also cut save
# FREQUENCY would only trade "an 822 MB save every push" for "a smaller-but-
# still-frequent save every push" — the frequency was the actual problem.
on:
  push:
    branches: [main]
    paths:
      - "packages/brink-desktop/**"
      - "crates/brink-cli/**"
      - "crates/brink-web/**"
      - "packages/wasm/**"
      - "packages/wasm-types/**"
      - "packages/ink-editor/**"
      - "packages/brink-studio/**"
      - "packages/ink-operations/**"
      - "packages/studio-shell/**"
      - "packages/studio-store/**"
      - "packages/studio-ui/**"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/desktop-bundle-smoke.yml"
      - ".github/workflows/**"
  pull_request:
    # Kept identical to `push`'s list above on purpose (#2716) — if one
    # changes, mirror the edit onto the other, or the two triggers drift
    # out of sync on which real changes this lane actually verifies.
    paths:
      - "packages/brink-desktop/**"
      # Unlike desktop-smoke.yml (#2477), this lane's sidecar build is NOT
      # stubbed — `ensure-cli-sidecar.mjs` really runs `cargo build -p
      # brink-cli --release` here, so a brink-cli source change is exactly
      # the kind of thing this lane exists to catch.
      - "crates/brink-cli/**"
      - "crates/brink-web/**"
      - "packages/wasm/**"
      - "packages/wasm-types/**"
      - "packages/ink-editor/**"
      - "packages/brink-studio/**"
      - "packages/ink-operations/**"
      - "packages/studio-shell/**"
      - "packages/studio-store/**"
      - "packages/studio-ui/**"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/desktop-bundle-smoke.yml"
      - ".github/workflows/**"

permissions: {}

concurrency:
  group: desktop-bundle-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  desktop-bundle-smoke:
    name: Desktop bundle smoke (tauri build --debug --bundles deb)
    runs-on: ubuntu-latest
    # A real release build of brink-cli (root workspace, NOT stubbed —
    # unlike desktop-smoke.yml), a real src-tauri debug build, and a wasm
    # build, in a lane branch protection does not watch. Generous on
    # purpose, same reasoning as desktop-smoke.yml's own 45.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # src-tauri links webkit2gtk/gdk/appindicator on Linux; without these
      # dev packages, even `cargo check` fails in gdk-sys's build script
      # before a single line of the crate itself compiles. Same list
      # desktop-smoke.yml installs.
      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev patchelf

      # Caches BOTH the root workspace (brink-cli's real release build,
      # below) and src-tauri's own excluded workspace.
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            .
            packages/brink-desktop/src-tauri

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.14.0

      # Must precede "Install dependencies" below — @brink-lang/web is a
      # file: dependency on this output.
      # `every_pnpm_install_lane_builds_wasm_first_in_the_same_job`
      # (packages/brink-desktop/src-tauri/src/lib.rs, #2504) enforces that
      # ordering for every job in every workflow file, this one included.
      - name: Build brink-web wasm package
        run: wasm-pack build crates/brink-web --target web --out-dir www/pkg

      # No `version:` input (#2604): the action reads root package.json's
      # `packageManager` field, matching every other pnpm lane.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm install --frozen-lockfile` exits 0 even when the file: link
      # above silently failed to resolve (#2479) — check the actual
      # resolved result rather than trust the install's own exit code.
      - name: Verify wasm package link (check-wasm-pkg)
        run: pnpm run check:wasm-pkg

      # The real thing: `beforeBuildCommand` (`pnpm build`) stages a REAL
      # brink-cli release binary (ensure-cli-sidecar.mjs, no
      # BRINK_SIDECAR_STUB set here) and runs `vite build`; the crate then
      # compiles; `beforeBundleCommand` (`scripts/assert-real-sidecar.mjs`)
      # runs against that real staged binary — the magic-byte check and the
      # #2699 `--version` smoke check's host-triple-match execute branch
      # both fire for real, on a real x86_64-unknown-linux-gnu ELF, exactly
      # as `docs/desktop-shell-spec.md`'s by-hand observation table
      # recorded — before tauri-bundler produces the `.deb`.
      - name: tauri build --debug --bundles deb
        working-directory: packages/brink-desktop
        run: pnpm tauri build --debug --bundles deb

      # Proof this ran for real, not merely that the command exited 0: a
      # bundling step that silently produced nothing would still exit 0 if
      # e.g. `--bundles deb` were dropped from the command by a future edit.
      - name: Verify a .deb bundle was produced
        run: |
          shopt -s nullglob
          files=(packages/brink-desktop/src-tauri/target/debug/bundle/deb/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no .deb bundle found under target/debug/bundle/deb" >&2
            exit 1
          fi
          echo "found bundle: ${files[*]}"
