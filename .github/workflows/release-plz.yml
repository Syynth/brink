name: release-plz

on:
  push:
    branches: [main]
  # `verify-lockfile-refresh` (below) dry-runs the excluded-lockfile-refresh
  # logic on PRs that could affect it, so that step — which for real only
  # runs rarely (on the run where release-pr opens a brand-new release PR)
  # and pushes with a PAT — gets exercised continuously instead of its
  # first live run being its first run ever (#1427). `release` and
  # `release-pr` stay gated to the `push` event via their own `if:` below,
  # so this trigger can never fire a real release or open a release PR from
  # a plain PR.
  pull_request:
    paths:
      - 'demos/compound/**'
      - 'benchmarks/tools/gen-input/**'
      - 'benchmarks/drivers/brink-loop/**'
      - 'crates/brink-runtime/**'
      - 'crates/brink-compiler/**'
      - 'crates/bevy-brink/**'
      - 'crates/internal/**'
      - 'Cargo.toml'
      - 'scripts/refresh-excluded-lockfiles.sh'
      - '.github/workflows/release-plz.yml'
  # Lets a maintainer exercise the dry run ad hoc, independent of a PR
  # touching the paths above.
  workflow_dispatch:

permissions: {}

jobs:
  # Publishes crates to crates.io and creates git tags + GitHub releases when a
  # release PR is merged (i.e. when the bumped versions land on `main`).
  release:
    name: release
    runs-on: ubuntu-latest
    # Only the `push` trigger above should ever run a real release — never
    # `pull_request` or `workflow_dispatch` (added for verify-lockfile-refresh).
    if: github.event_name == 'push'
    # Gate the publish behind the `crates-io` environment (optional required
    # reviewers; also scopes the OIDC trust). Configure it under
    # Settings > Environments > crates-io.
    environment: crates-io
    permissions:
      contents: write   # push tags + create GitHub releases
      id-token: write   # mint the crates.io OIDC token (Trusted Publishing)
    concurrency:
      group: release-plz-release
    # Hard backstop against the 360-minute Actions default (#2697):
    # `cargo publish`'s per-crate verification build across the workspace.
    # Measured against the most recent real multi-crate publish (PR #2702
    # review): run 29133014255 / job 86491927716 (2026-07-11, ~15
    # publishable crates bumped together) — the `release-plz release` step
    # took 3m30s, the whole job 4m12s wall. 30 keeps ~7x headroom over that
    # measured run; revisit if bevy-brink's verification build (added since)
    # meaningfully changes the picture.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # Toolchain comes from rust-toolchain.toml (rustup honors it).
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `cargo publish` runs a verification build of each crate; bevy-brink's
      # bevy deps need these system libs (matches ci.yml).
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: release-plz release
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5
        with:
          command: release
        env:
          # A PAT (not the default GITHUB_TOKEN) so the tags release-plz pushes
          # can trigger the cargo-dist `release.yml` workflow. See docs/releasing.md.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # Publishing authenticates via crates.io Trusted Publishing (OIDC) using
          # the `id-token: write` permission above — no stored registry token.

  # Opens/updates the release PR (version bump + changelogs) on every push to main.
  release-pr:
    name: release-pr
    runs-on: ubuntu-latest
    # Only the `push` trigger above should ever open/update the real release
    # PR — never `pull_request` or `workflow_dispatch` (added for
    # verify-lockfile-refresh).
    if: github.event_name == 'push'
    permissions:
      contents: write        # push the release branch
      pull-requests: write   # open/update the release PR
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    # Hard backstop against the 360-minute Actions default (#2697): the
    # version bump plus the excluded-lockfile refresh's git operations.
    # Measured against the three most recent completed push runs (PR #2702
    # review): 17m04s (run 31982389154 / job 95251383535, merge-base
    # c69ec52), 17m31s (run 31981219991 / job 95248215707), 13m34s (run
    # 31979594517 / job 95244146760) — two of three already over the old
    # 15m cap, with the `release-plz release-pr` step alone at
    # 16m24s/17m00s. 45 keeps real headroom above the worst measured run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: release-plz release-pr
        id: release-pr
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # A version bump changes every crates/*/Cargo.toml `version`, which
      # stales the Cargo.lock of any workspace-excluded crate that takes a
      # `path` dependency on a bumped crate (Cargo.lock still lists the old
      # version even though it's a path dep, and `--locked` in
      # demo.yml/benchmarks.yml fails on the mismatch). Without this step the
      # NEXT release would leave demos/compound and benchmarks/{gen-input,
      # brink-loop} lockfiles stale, re-reddening those gates the moment
      # #1418's path-filter fix lets them see the release PR (#1418, priority
      # item 3 — release.yml is cargo-dist-generated, house rule 5, so this
      # lives here instead).
      #
      # The actual per-directory `cargo update -p <name>` loop lives in
      # scripts/refresh-excluded-lockfiles.sh (not a blanket `cargo update`,
      # so only the brink/bevy-brink path-dependency entries actually
      # re-resolve; each excluded crate's *external* deps (bevy, rand, ...)
      # are left exactly as committed) — shared with the
      # `verify-lockfile-refresh` job below, which runs the same script
      # with `--dry-run` on PRs so this logic doesn't go completely
      # unexercised between releases (#1427).
      - name: Refresh workspace-excluded lockfiles for the release PR
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # Passed via env (not inlined as `${{ ... }}` in the script body) so
          # the JSON can't be interpreted as shell syntax.
          RELEASE_PR_JSON: ${{ steps.release-pr.outputs.pr }}
        run: |
          set -euo pipefail
          branch="$(jq -r '.head_branch' <<< "$RELEASE_PR_JSON")"
          if [[ -z "$branch" || "$branch" == "null" ]]; then
            echo "No head_branch in the release-pr 'pr' output; skipping lockfile refresh." >&2
            exit 1
          fi
          git fetch origin "$branch"
          git checkout -B "$branch" FETCH_HEAD

          ./scripts/refresh-excluded-lockfiles.sh

          # Read the affected lockfile paths from the script itself
          # (`--print-lockfiles`) instead of hardcoding them a second time
          # here: the script's `excluded_dirs` array is the one source of
          # truth for which lockfiles the refresh touches, so a new excluded
          # crate added there is picked up here automatically (#1427 review
          # — previously this list and the refresh loop lived in the same
          # step; now that they're in different files, drifting them apart
          # would silently drop a lockfile from the diff/add and never push
          # its refresh).
          mapfile -t lockfiles < <(./scripts/refresh-excluded-lockfiles.sh --print-lockfiles)

          if git diff --quiet -- "${lockfiles[@]}"; then
            echo "Excluded-crate lockfiles already current; nothing to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${lockfiles[@]}"
          git commit -m "chore: refresh workspace-excluded lockfiles for this release"
          # RELEASE_PLZ_TOKEN (a PAT), not the default GITHUB_TOKEN: pushes made
          # with GITHUB_TOKEN don't trigger other workflow runs, so
          # demo.yml/benchmarks.yml would never re-check this branch (same
          # reasoning as the release job's GITHUB_TOKEN override, see
          # docs/releasing.md).
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # actions/checkout on this job does NOT set persist-credentials:
          # false, so git's local http.extraheader carries an
          # `Authorization: basic <GITHUB_TOKEN>` for github.com that takes
          # precedence over the x-access-token userinfo above — the push
          # would silently authenticate as GITHUB_TOKEN and defeat the whole
          # point of using RELEASE_PLZ_TOKEN. Clear it before pushing.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push origin "HEAD:$branch"

  # Dry-runs scripts/refresh-excluded-lockfiles.sh (the same script the real
  # refresh step above calls) so the mechanism gets exercised on ordinary
  # PRs instead of only on the rare push where release-pr opens a brand-new
  # release PR. `--dry-run` resolves each excluded crate's brink/bevy-brink
  # path deps via `cargo update --dry-run` — real dependency resolution,
  # capable of failing exactly like the live step would (a broken path dep,
  # a version constraint that no longer matches) — but never writes a
  # Cargo.lock, needs no release branch, no git identity, and no push, so
  # it's safe to run from a plain PR checkout (#1427).
  verify-lockfile-refresh:
    name: verify-lockfile-refresh (dry-run)
    runs-on: ubuntu-latest
    # Runs for the `pull_request` and `workflow_dispatch` triggers above,
    # never for `push` (that's the real release-pr/release path).
    if: github.event_name != 'push'
    concurrency:
      group: release-plz-verify-lockfile-refresh-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    # Hard backstop against the 360-minute Actions default (#2697): a
    # dry-run `cargo update --dry-run` over three excluded lockfiles.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Dry-run excluded-lockfile refresh
        run: ./scripts/refresh-excluded-lockfiles.sh --dry-run
