name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merge-queue candidates (2026-08-06 decision, docs/decision-log.md "Move
  # toward a GitHub merge queue for main"): the queue tests each candidate on
  # a temporary gh-readonly-queue/main/… ref, which fires a `merge_group`
  # event — not `push` or `pull_request`. Without this trigger, queued PRs
  # wait forever for required checks that never start. A no-op until a merge
  # queue is actually enabled on the repo.
  merge_group:

# Least privilege: jobs only read the repo. Grant more per-job if ever needed.
permissions: {}

# Cancel a branch's in-flight run when a new commit supersedes it (#1237).
# Without this, pushing to a PR left the previous run's whole job matrix
# competing for runners: during one multi-PR wave, 3 of the queued runs were
# superseded and cancelling them alone dropped the backlog from 72 to 37
# queued jobs — roughly half the queue was work nobody would ever read.
#
# `main` is deliberately EXEMPT: superseded pushes there are rare, and
# cancelling them would leave individual main commits with no CI record,
# which weakens bisecting. PR branches are where repeated pushes actually
# happen (a fix agent pushing three times triggers three full matrices).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is PURE OVERHEAD on a CI runner: every job starts
  # from a cold checkout, so the per-CGU dependency-graph cache is written and
  # never read. (Context in #1695: a full `--workspace --tests` build is 15G at
  # default settings; incremental is part of that write volume.)
  CARGO_INCREMENTAL: 0

# Third-party actions are pinned to full commit SHAs (mutable tags can be
# repointed at malicious code). The trailing comment tracks the version;
# Dependabot bumps both together.
jobs:
  # CI-self-enforcing counterpart to `every_pnpm_install_lane_builds_wasm_first_
  # in_the_same_job` (#2504), for a different recurring defect (#2820): a PR
  # touching packages/{brink-studio,studio-ui,studio-shell,ink-operations,
  # studio-store}/src — the published @brink-lang/studio itself plus the
  # four private packages BUNDLED into it (see docs/publishing.md) — but
  # carrying no @brink-lang/studio changeset. Three real instances
  # (PR #2787, #2798, #2817) — see
  # scripts/check-studio-changeset.mjs's header for the full history and why
  # "not wasm-observable" is the wrong (but tempting) rule to reach for here.
  #
  # Needs no wasm build, no `pnpm install` — just the diff against the PR's
  # base branch — so it runs as its own lightweight, fast-failing lane rather
  # than inside the much heavier `frontend` job below. `pull_request`-only:
  # a push to main has nothing left to diff against (already merged), and
  # `merge_group` has no single PR-shaped base ref to compare to.
  #
  # `fetch-depth: 0` is required, not just convenient: a shallow HEAD (the
  # default) has no parent commit objects at all, so no amount of fetching
  # origin/<base> afterward lets `git merge-base`/`diff …origin/<base>...HEAD`
  # resolve — see scripts/check-studio-changeset.mjs's `gatherDiff` doc.
  studio-changeset-guard:
    name: Studio changeset guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: node scripts/check-studio-changeset.mjs

  check:
    name: Check
    runs-on: ubuntu-latest
    # Hard backstop against the 360-minute Actions default (#2697): a
    # workspace type-check plus one wasm32 target check.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check --workspace
      # The wasm-side test modules (`wasm_bindgen_test`) were compiled by no
      # CI job — only the lib was ever checked for wasm32 — so they bitrotted
      # invisibly when PR #654's module split broke their `super::` paths
      # (#672 lane G finding). Compile them here; the `wasm-test` job below
      # actually *executes* them (#672 workstream D).
      - run: cargo check -p brink-web --all-targets --target wasm32-unknown-unknown

  # Executes the `#[wasm_bindgen_test]` suite under Node (the `check` job
  # above only type-checks it for wasm32 — it never ran, so PR #620's
  # Record→null marshal regression would not have been caught by any CI
  # job). All 49 tests here go through `web_sys::console::*` at most — no
  # `window`/`document`/`fetch`/storage — so Node's built-in `console`
  # satisfies every dependency and no headless browser is needed. If this
  # job proves flaky in practice, drop it from branch-protection's required
  # list rather than deleting it (#672 workstream D).
  wasm-test:
    name: Wasm Tests (brink-web)
    runs-on: ubuntu-latest
    # Hard backstop against the 360-minute Actions default (#2697): 49
    # wasm_bindgen_test cases under Node.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        # Pin the version (matching the `frontend` job below): the default
        # `latest` queries the GitHub API for the newest release and breaks
        # under API rate limiting (HTML, not JSON).
        with:
          version: v0.14.0
      - run: wasm-pack test --node crates/brink-web

  test:
    name: Test
    runs-on: ubuntu-latest
    # Hard backstop against the 360-minute Actions default (#2697):
    # `cargo test --workspace --exclude bevy-brink`.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # No "Install Linux dependencies (bevy)" step here: this job excludes
      # bevy-brink (below), and no other workspace member (the workspace's
      # `members` glob excludes `demos/*`, the only other crate that depends
      # on `bevy`) links the bevy umbrella, so `cargo test --workspace`
      # never touches wayland-sys/winit/alsa's build scripts. The jobs that
      # genuinely need these system libs — because they build or test
      # bevy-brink directly — are `test-bench-counters`, `determinism-law`,
      # and `book`; each installs them itself.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # bevy-brink is EXCLUDED from THIS job: the bevy dependency graph is
      # the dominant build cost and `cargo test` LINKS the examples — a
      # 300+ rlib binary that intermittently crashed the runner's linker
      # (ld bus error), hitting parser/compiler PRs that never touch bevy
      # 3x in one day. (2026-07-20 ruling, still in force.) bevy-brink-derive
      # is not excluded — see the `static-checks` job for why.
      #
      # It is NOT unchecked: the required `Test (bench-counters)` job below
      # lints every bevy-brink target and runs its lib + integration tests in
      # its own runner slot, in parallel with this one, without linking the
      # examples (#1641). Do not re-add bevy-brink here — put coverage there.
      - run: cargo test --workspace --exclude bevy-brink

  # The feature-gated / bevy lane. Two things live here, both invisible to the
  # `test` job above, and both cheap to co-locate because they share one
  # dependency-graph build:
  #
  # 1. `--features bench-counters` is off by default (a compile-time cut, not
  #    a runtime toggle — see `crates/brink-runtime/src/bench_counters.rs`),
  #    so the `test` job never builds or runs anything gated on it. PR #921's
  #    counter-forwarding proofs only ever ran locally until this job existed
  #    (#923, tracked from #897).
  #
  # 2. bevy-brink, which the `test`, `test-all-features` and `static-checks`
  #    jobs all exclude (2026-07-20: build cost + an ld bus error linking the
  #    300+ rlib `play_story` example). bevy-brink-derive is NOT excluded
  #    anywhere — it's `proc-macro = true` with only syn/quote/proc-macro2 as
  #    dependencies, so it pays none of the cost the exclusion exists to
  #    avoid and stays covered by the cheap jobs. The bevy-brink exclusion
  #    left a CRATE-SIZED HOLE in the merge gate — ~a dozen bevy-brink PRs
  #    landed against a gate that ran exactly one of its tests (#1641). The
  #    two steps below close it without reversing the ruling:
  #      * clippy `--all-targets` TYPE-CHECKS the examples but never links
  #        them, so the bus error cannot occur — and it restores the
  #        compile-check of `examples/book_flows.rs`, which the book's Bevy
  #        flows page `{{#include}}`s and which no job had checked since the
  #        exclusion landed.
  #      * `cargo test --lib --tests` deliberately omits `--examples`, so
  #        `play_story` itself is never linked. But it does NOT eliminate
  #        link-crash exposure: `tests/scenario_bench_model.rs` and
  #        `tests/scenario_baseline_tripwire.rs` both `#[path]`-include
  #        `benches/scenario/model.rs`, which pulls in the `bevy` umbrella
  #        (MinimalPlugins, AssetPlugin, ComputeTaskPool, …) — the same
  #        dev-dependency (`bevy = { version = "0.19.0", features =
  #        ["file_watcher"] }`, default features on) that `play_story`
  #        links. So this step still links two headless test binaries
  #        against the full bevy graph; exposure to the 2026-07-20 ld bus
  #        error is NARROWED to those two binaries, not removed. If it
  #        recurs here, the escape hatch is either narrowing
  #        `benches/scenario/model.rs`'s imports to the granular bevy_*
  #        crates it actually needs instead of the umbrella, or dropping
  #        this job from branch protection's required-checks list.
  #    Both run under `--all-features`, which for bevy-brink is a strict
  #    superset of its default `dev` feature and turns ON `bench-counters`
  #    (so `scenario_bench_model.rs`'s counter-forwarding test finally runs in
  #    CI) and `effect-trace`. One feature configuration, therefore one bevy
  #    graph build, is the whole cost lever: adding a second default-feature
  #    pass would rebuild the entire bevy graph again for a handful of extra
  #    test functions. bevy-brink's default-feature COMPILE is still covered
  #    by the `Check` job's `cargo check --workspace`.
  #
  # This is a separate job (not steps folded into `test`) so it claims its own
  # runner slot and runs in PARALLEL with `test` rather than serializing the
  # bevy graph onto the critical path, and so a failure here names itself in
  # the checks list instead of hiding inside a huge workspace test blob.
  #
  # The job NAME is load-bearing: "Test (bench-counters)" is in branch
  # protection's required-checks list, so renaming it would silently drop this
  # lane out of the merge gate. Change the name only together with the
  # branch-protection setting.
  #
  # Steps use `if: '!cancelled()'` (same rationale as `static-checks`): a
  # clippy failure must not hide a test failure behind it.
  test-bench-counters:
    name: Test (bench-counters)
    runs-on: ubuntu-latest
    # Hard backstop against the 360-minute Actions default (#2697): the
    # bevy-brink dependency graph build plus its clippy/test/doc legs.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Same bevy-brink dev-dependency system libs as the `test` job above.
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: bench-counters
      # Cheapest first: brink-runtime's bench-counters coverage is bevy-free.
      - name: Test (brink-runtime, bench-counters)
        id: runtime_bench_counters
        run: cargo test -p brink-runtime --features bench-counters
      # `--all-targets` covers lib + tests + examples + benches. Clippy only
      # type-checks, so the examples are compile-checked without ever being
      # linked (see this job's header comment).
      - name: Clippy (bevy-brink, all features)
        id: bevy_clippy
        if: '!cancelled()'
        run: cargo clippy -p bevy-brink -p bevy-brink-derive --all-targets --all-features -- -D warnings
      # `--lib --tests` and NOT `--all-targets`: running the suite must not
      # link the `play_story` example (the 2026-07-20 ld bus error).
      - name: Test (bevy-brink, all features)
        id: bevy_test
        if: '!cancelled()'
        run: cargo test -p bevy-brink -p bevy-brink-derive --all-features --lib --tests
      # Doctests are a separate cargo invocation from `--lib --tests` above
      # (cargo has no combined flag for lib+tests+doc), so they need their
      # own step, but they carry the same 2026-07-20 link-crash exemption:
      # `--doc` builds one merged doctest binary from the crate's `///`/`//!`
      # examples and never touches `examples/play_story.rs`, so it does not
      # reopen that bus error (verified locally under `--all-features`: all
      # 17 bevy-brink doctests compile and link in ~9s, #1700).
      - name: Test (bevy-brink, doc)
        id: bevy_doc
        if: '!cancelled()'
        run: cargo test -p bevy-brink -p bevy-brink-derive --all-features --doc

  # Companion to `clippy-all-features` above — see its comment for why this
  # leg exists and how it subsumes #947. Runtime cost measured comparable to
  # the default `test` job (workspace test compile dominates; the extra
  # feature-gated test functions are a handful of fast unit/integration
  # tests), so it runs `cargo test`, not just clippy.
  test-all-features:
    name: Test (all features)
    runs-on: ubuntu-latest
    # Hard backstop against the 360-minute Actions default (#2697):
    # `cargo test --workspace --all-features --exclude bevy-brink`.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # No "Install Linux dependencies (bevy)" step here either, for the same
      # reason as the `test` job above: this job also excludes bevy-brink
      # (below), so nothing it builds touches bevy's system libs.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: all-features
      # Same bevy-brink exclusion as the `test` job (build cost + the example
      # link crash). bevy-brink's own `--all-features` test run lives in the
      # required `Test (bench-counters)` job (#1641).
      - run: cargo test --workspace --all-features --exclude bevy-brink

  # Consolidated static checks (decision 2026-07-22, #1237). Previously six
  # separate jobs — Format, Clippy, Clippy (all features), no_std ×2, and the
  # publishable pre-flight — each under a minute of real work but each paying
  # a full runner slot, checkout, and cache restore. At ~29 jobs a single push
  # nearly saturated the account's 20-job concurrency ceiling, so wave
  # throughput was bounded by job COUNT rather than by work. Coverage is
  # identical; only the packaging changed.
  #
  # Steps run in cheapest-first order so the fastest signal fails first, and
  # every step runs even if an earlier one fails (`if: always()`) — otherwise
  # consolidating would hide a clippy failure behind a fmt failure, which is
  # exactly the granularity loss worth avoiding.
  static-checks:
    name: Static checks (fmt, clippy, no_std, publishable)
    runs-on: ubuntu-latest
    # Hard backstop against the 360-minute Actions default (#2697): seven
    # cheap-by-design steps (fmt, two clippy legs, two no_std checks, the
    # test-util fence, the crates.io publishability probe).
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # `--all-targets` compiles the bevy examples, which need bevy's Linux
      # system libs (wayland-sys build script, etc.).
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: static-checks

      - name: Format
        id: fmt
        run: cargo fmt --all -- --check

      # Both clippy legs exclude bevy-brink so this job never pays for the
      # bevy dependency graph. bevy-brink-derive is NOT excluded: it's
      # `proc-macro = true` with only syn/quote/proc-macro2 as dependencies —
      # zero bevy, zero tests — so it pays none of the build cost the
      # exclusion exists to avoid and stays covered by this cheap job instead
      # of being parked behind the 7-minute bevy job. bevy-brink itself is
      # NOT unlinted: `Test (bench-counters)` runs `clippy -p bevy-brink -p
      # bevy-brink-derive --all-targets --all-features -- -D warnings` in its
      # own runner slot, where the graph is already built for that job's test
      # run (#1641). Lint changes that must reach bevy-brink go there.
      - name: Clippy
        id: clippy
        if: '!cancelled()'
        run: cargo clippy --workspace --all-targets --exclude bevy-brink -- -D warnings

      - name: Clippy (all features)
        id: clippy_all
        if: '!cancelled()'
        run: cargo clippy --workspace --all-targets --all-features --exclude bevy-brink -- -D warnings

      - name: no_std (brink-format)
        id: nostd_format
        if: '!cancelled()'
        run: cargo check -p brink-format --no-default-features

      - name: no_std (brink-runtime)
        id: nostd_runtime
        if: '!cancelled()'
        run: cargo check -p brink-runtime --no-default-features

      # `test-util` fence (#2168): `brink-compiler`'s legacy closure/path
      # compile entry points are gated behind the `test-util` feature so a
      # new production consumer can't reach for them by accident — but that
      # only holds for a build that never resolves `brink-test-harness` (a
      # normal, non-dev dependency there enables the feature and unifies it
      # across the whole `--workspace` resolve). This isolated `-p` check
      # covers every crate that consumes `brink-compiler` in production
      # (`brink-cli`, `brink-web`, `brink-lsp`, `bevy-brink`,
      # `brink-environment`) without pulling in the test harness, so it
      # actually proves the fence a `--workspace` check cannot.
      - name: Compiler test-util fence holds in isolation
        id: test_util_fence
        if: '!cancelled()'
        run: cargo check --locked -p brink-cli -p brink-web -p brink-lsp -p bevy-brink -p brink-environment

      # Publishability pre-flight (#1232). crates.io Trusted Publishing tokens
      # can publish a new VERSION of an existing crate but CANNOT CREATE one —
      # the first publish of any new crate must be done by hand. When
      # `brink-syntax-native` landed as a publishable crate crates.io had never
      # heard of, release-plz aborted the ENTIRE workspace release on it and
      # every crate release failed for days before anyone noticed (npm-release
      # kept succeeding, so nothing looked broken). This makes that failure
      # loud on the PR that introduces the crate.
      - name: Publishable crates exist on crates.io
        id: publishable
        if: '!cancelled()'
        run: |
          set -euo pipefail
          crates=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.publish == null) | .name' | sort)
          echo "Publishable workspace crates:"; echo "$crates" | sed 's/^/  - /'
          missing=""
          for crate in $crates; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "brink-ci (https://github.com/Syynth/brink)" \
              "https://crates.io/api/v1/crates/${crate}")
            case "$code" in
              200) echo "ok: ${crate}" ;;
              404) echo "MISSING: ${crate}"; missing="${missing} ${crate}" ;;
              *)   echo "::warning::${crate}: unexpected status ${code} from crates.io; skipping" ;;
            esac
            sleep 1
          done
          if [ -n "${missing}" ]; then
            echo "::error::These crates are publishable but have never been published to crates.io:${missing}"
            echo "::error::crates.io Trusted Publishing CANNOT create a new crate, so release-plz will abort the whole workspace release."
            echo "::error::Fix by EITHER setting 'publish = false' in the crate's Cargo.toml, OR having a maintainer run 'cargo publish -p <crate>' once by hand."
            exit 1
          fi

      # #2080 review finding: `brink-environment` embeds
      # `std/conventions/screenplay.brink` via `include_str!(concat!(
      # env!("CARGO_MANIFEST_DIR"), ...))`. `include_str!` cannot reach
      # outside its own package root, so that path — and any future one
      # like it — must resolve to a file `cargo package` actually ships;
      # an out-of-package path builds and tests fine locally (cargo runs
      # from the workspace checkout, where the path still resolves) but
      # breaks for every consumer once published, because the packaged
      # tarball never contained the file. `cargo package`'s own verify
      # build doesn't catch this either — it happens to unpack to
      # `target/package/<pkg>-<ver>/`, where a `../../..`-shaped path can
      # accidentally resolve back into the surrounding checkout and still
      # find the file. Listing the tarball's real contents and grepping
      # for the mounted file is the only way to catch this before
      # release-plz does.
      - name: brink-environment package contains its embedded stdlib source
        id: environment_package_list
        if: '!cancelled()'
        run: |
          set -euo pipefail
          cargo package -p brink-environment --locked --list \
            | grep -F 'std/conventions/screenplay.brink'

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    # Hard backstop against the 360-minute Actions default (#2697): one
    # advisory/license/source-allowlist check.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Supply-chain gate: advisories, licenses, banned crates, source allowlist.
      #
      # ⚠ This covers the ROOT workspace's graph only.
      # `packages/brink-desktop/src-tauri` is its own excluded workspace with
      # its own `Cargo.lock`, audited by a companion step in the
      # (non-required) `desktop-smoke.yml` — #2470, and see
      # docs/desktop-shell-spec.md "Smoke-lane inputs and step gating" for why
      # it reports rather than blocks. Both steps share the root `deny.toml`
      # and this SHA pin; `desktop_smoke_audits_the_src_tauri_dependency_graph`
      # (src-tauri/src/lib.rs) fails if the two pins drift apart.
      # ⚠ The bundled image's cargo-deny version is mirrored by
      # `CARGO_DENY_VERSION` in scripts/setup-dev.sh (#2498). Bumping this
      # SHA changes that version — update the script in the same PR, or a
      # local audit silently disagrees with this job.
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check
  # Bounded fuzz smoke runs (#672 workstream C) — not continuous fuzzing
  # campaigns. Consolidated from a 9-entry matrix into ONE job (decision
  # 2026-07-22, #1237): each leg was only ~30s of actual fuzzing, but every
  # leg re-installed cargo-fuzz and claimed its own runner slot, so the matrix
  # alone consumed 9 of the account's 20 concurrent jobs — 45% of total CI
  # capacity for ~17 minutes of work. One job installs cargo-fuzz once and
  # loops the targets.
  #
  # The loop records failures and reports ALL of them at the end rather than
  # stopping at the first, preserving the old matrix's `fail-fast: false`
  # semantics — without that, consolidating would hide every target after the
  # first failure.
  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    # Hard backstop independent of each target's own `-max_total_time` budget
    # (30s of intended fuzz time apiece) — if a target ever fails to
    # self-terminate, the job dies here instead of burning CI minutes silently.
    # Scaled for the whole set now that they share one job.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: fuzz
      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      # Lockfile-drift gate (#1396 gap 2, house rule 19o): `cargo +nightly
      # fuzz run` below has no `--locked` of its own — cargo-fuzz doesn't
      # expose one — so a stale fuzz-crate Cargo.lock (e.g. after a parent
      # crate's deps change) would otherwise be silently refreshed and the
      # job would exit 0, same drift shape #1386 fixed for demos/compound.
      # `cargo metadata --locked` fails loudly instead of refreshing when a
      # committed lockfile no longer matches its manifest. All four
      # workspace-excluded fuzz crates now carry a committed Cargo.lock.
      - name: Verify fuzz crate lockfiles are not stale
        run: |
          set -uo pipefail
          dirs="
          crates/internal/brink-syntax/fuzz
          crates/internal/brink-syntax-native/fuzz
          crates/internal/brink-format/fuzz
          crates/brink-runtime/fuzz
          "
          failed=""
          for dir in $dirs; do
            if ! cargo metadata --locked --no-deps --format-version 1 \
                 --manifest-path "${dir}/Cargo.toml" >/dev/null; then
              echo "::error::stale or missing Cargo.lock in ${dir}"
              failed="${failed} ${dir}"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "::error::stale fuzz lockfiles:${failed}"
            exit 1
          fi
      - name: Fuzz all targets
        run: |
          set -uo pipefail
          # target|crate_dir|seed_dir — the two shared seed dirs mirror the
          # input shapes: `seeds/inkb` for the four targets taking a `.inkb`
          # byte buffer, `seeds/inkt` for the two taking an `.inkt` string,
          # same as brink-syntax's single `seeds/ink` and brink-syntax-native's
          # single `seeds/brink`, each for its own pair of &str targets.
          targets="
          parse_no_panic|crates/internal/brink-syntax/fuzz|seeds/ink
          parse_lossless|crates/internal/brink-syntax/fuzz|seeds/ink
          parse_no_panic|crates/internal/brink-syntax-native/fuzz|seeds/brink
          parse_lossless|crates/internal/brink-syntax-native/fuzz|seeds/brink
          vm_no_panic|crates/brink-runtime/fuzz|seeds/vm_no_panic
          read_no_panic|crates/internal/brink-format/fuzz|seeds/inkb
          write_read_roundtrip|crates/internal/brink-format/fuzz|seeds/inkb
          read_index_no_panic|crates/internal/brink-format/fuzz|seeds/inkb
          section_reads_no_panic|crates/internal/brink-format/fuzz|seeds/inkb
          read_inkt_no_panic|crates/internal/brink-format/fuzz|seeds/inkt
          inkt_write_read_roundtrip|crates/internal/brink-format/fuzz|seeds/inkt
          "
          failed=""
          root="$PWD"
          for entry in $targets; do
            target="${entry%%|*}"; rest="${entry#*|}"
            crate_dir="${rest%%|*}"; seed_dir="${rest#*|}"
            echo "::group::fuzz ${target}"
            cd "$root/$crate_dir"
            mkdir -p "corpus/${target}"
            if cargo +nightly fuzz run "${target}" "corpus/${target}" "${seed_dir}" \
                 -- -seed=1 -max_total_time=30 -max_len=8192; then
              echo "ok: ${target}"
            else
              echo "::error::fuzz target ${target} FAILED"
              failed="${failed} ${target}"
            fi
            echo "::endgroup::"
          done
          cd "$root"
          if [ -n "${failed}" ]; then
            echo "::error::failing fuzz targets:${failed}"
            exit 1
          fi

  # BH-3's determinism law (#927, closing #926): the parallel batch driver
  # must be byte-identical to the serial driver, in flow-id order, over
  # randomized workloads. It already runs inside the `test` job's
  # `cargo test --workspace` above, but sharing that job means a law
  # violation is just one more failure buried in a huge workspace test blob
  # instead of naming itself in the checks list (#897, tracked to #940).
  #
  # Same fuzz-smoke shape as the `fuzz` matrix above: an independent job (not
  # a step folded into `test`), a seed PINNED via env var rather than left to
  # the test's hardcoded default (reproducible across runs, and the matrix
  # shape lets a future PR add more pinned-seed lanes without any one
  # violation silently skipping the others), and a modest fixed iteration
  # budget (64 randomized workloads) — this is a correctness gate on every
  # PR, not a soak/fuzz campaign.
  determinism-law:
    name: Determinism law (BH-3) — seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 918273645
            iterations: 64
    # Hard backstop: this test is a handful of seconds of work, so a hang
    # here means the parallel driver deadlocked, not that the budget was too
    # tight.
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BRINK_DETERMINISM_LAW_SEED: ${{ matrix.seed }}
      BRINK_DETERMINISM_LAW_ITERATIONS: ${{ matrix.iterations }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # This job runs `cargo test -p bevy-brink` directly (below), so unlike
      # `test` / `test-all-features` (which exclude bevy-brink and no longer
      # install these), it genuinely needs bevy's Linux system libs.
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: determinism-law-${{ matrix.seed }}
      - name: Determinism law (pinned seed ${{ matrix.seed }}, ${{ matrix.iterations }} iterations)
        run: cargo test -p bevy-brink --lib batch::tests::parallel_equals_serial_over_randomized_workloads -- --exact

  book:
    name: Book
    runs-on: ubuntu-latest
    # Hard backstop against the 360-minute Actions default (#2697): mdbook
    # build/test plus the doctest dependency build and the TS type-check.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # bevy-brink (built below for the Bevy doctests' -L path) transitively
      # needs these system libs via its bevy_* deps' build scripts.
      #
      # No rust-cache here on purpose: the doctest deps go in a non-default
      # target dir and are consumed by rustdoc, which rejects artifacts built by
      # a different rustc (E0514) — a restored cache from an older toolchain
      # breaks the run. The build below is always fresh.
      #
      # The Bevy *flows* page is `{{#include}}`d from crates/bevy-brink/examples/
      # book_flows.rs, which is compile-checked by the `Test (bench-counters)`
      # job's `clippy -p bevy-brink --all-targets` step, so it needs no step
      # here. (That was previously the `test` job, but bevy-brink has been
      # excluded from it since 2026-07-20 — leaving this example checked by
      # nothing at all until #1641.)
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo install mdbook --locked
      - run: mdbook build docs/book
      # Compile the book's Rust examples as doctests. Without this, a signature
      # change can silently rot every example in the book — which is exactly
      # what happened to `Story::new` across the Program → Arc refactor.
      #
      # One cargo invocation for the whole package set: rustdoc resolves the
      # examples off -L, and two builds of a crate with different hashes make
      # it bail with E0464. See the `book-test` recipe in the justfile.
      #
      # `--features brink-compiler/test-util`: four chapters' fences call
      # `compile_path`/`compile_path_with_options` (#2168 gated these behind
      # `test-util`, off by default). This is the interim unblock, not the
      # fix — those chapters teach an API surface an external crates.io
      # consumer cannot call. Tracked in #2175: migrate the fences to
      # `brink_environment::Project::load` + `compile`, add `-p
      # brink-environment` here, and drop this flag.
      - run: cargo build -p brink-runtime -p brink-compiler -p brink-format -p brink-intl -p bevy-brink -p brink-project-config --features brink-compiler/test-util
        env:
          CARGO_TARGET_DIR: target/book-doctest
      # Run mdbook under the pinned toolchain (rust-toolchain.toml). `cargo
      # build` above honors the pin, but mdbook's rustdoc subprocess otherwise
      # picks up the runner's default toolchain — a rustc-version mismatch that
      # makes rustdoc reject the freshly-built deps (E0514).
      #
      # CARGO_MANIFEST_DIR: Bevy's derives resolve the `bevy` vs `bevy_ecs` crate
      # path from the manifest, and rustdoc runs outside a cargo context.
      - name: mdbook test (doctests)
        run: |
          channel=$(grep -oE 'channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)
          rustup run "$channel" mdbook test docs/book -L target/book-doctest/debug/deps
        env:
          CARGO_MANIFEST_DIR: ${{ github.workspace }}/crates/bevy-brink
      # Type-check the book's TypeScript examples against the published
      # @brink-lang packages (the TS counterpart of `mdbook test`).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: docs/book/ts-check
      - run: npm run check
        working-directory: docs/book/ts-check

  frontend:
    name: Frontend (brink-studio)
    runs-on: ubuntu-latest
    # Hard backstop against the 360-minute Actions default (#2697): the
    # wasm build plus the full pnpm test/typecheck/vitest sequence — the
    # heaviest single job in this file outside the bevy/e2e lanes.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        # Pin the version (matching npm-release.yml): the default `latest`
        # queries the GitHub API for the newest release and breaks under API
        # rate limiting (HTML, not JSON).
        with:
          version: v0.14.0
      # The @brink-lang/web package is a file: dependency on the wasm-pack output,
      # so the bundle must be built BEFORE `pnpm install` can link it (#2479).
      # This ordering is CI-self-enforcing: `every_pnpm_install_lane_builds_wasm_first_in_the_same_job`
      # (packages/brink-desktop/src-tauri/src/lib.rs, #2504) fails if this
      # step ever moves after "Install dependencies" below.
      - name: Build brink-web wasm package
        run: wasm-pack build crates/brink-web --target web --out-dir www/pkg
      # No `version:` input on purpose (#2604): with it omitted the action reads
      # root package.json's `packageManager` field, so corepack, this lane and
      # scripts/setup-dev.sh all resolve ONE exact pnpm version. Pinning only a
      # major here made which 10.x a runner got ambient, and the same missing
      # `crates/brink-web/www/pkg` link produced two different failure shapes
      # across that range (#2479/#2492 exit 0 vs #2593/#2596 exit 1).
      # `scripts/check-pnpm-pin.mjs` (via `pnpm test:scripts`) fails if a
      # `version:` input reappears here disagreeing with the pin.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      # Needs only Node — no install, no wasm build — so it runs before
      # either. The structurally parallel sibling gate for
      # packages/brink-desktop's own preflight pair is
      # packages/brink-desktop/src/__tests__/ensure-wasm.test.ts, run below
      # via `pnpm --filter @brink/desktop test`.
      - name: Unit tests (node --test, scripts)
        run: pnpm run test:scripts
      # Named for the whole script, not one branch of it: this harness began
      # as audit-timeout-only (#2531) but now drives setup-dev.sh end to end
      # against a stubbed fresh machine, plus every bounded network step's
      # hang AND fast-failure path (#2591/#2638). The step name is the first
      # thing a red CI shows, so it must not describe a subset.
      - name: Unit tests (scripts/setup-dev.sh)
        run: pnpm run test:setup-dev
      # #2688 gap 1: scripts/refresh-excluded-lockfiles.test.sh already ran in
      # CI before this step existed — it rides `pnpm test:scripts`'s glob
      # (`node --test scripts/*.test.mjs`) via its refresh-excluded-lockfiles.
      # test.mjs wrapper (#2671/#2667), so this step adds NO new coverage.
      # What it adds is a NAMED, separately-reportable step: a red run of
      # this harness previously surfaced only as part of the "Unit tests
      # (node --test, scripts)" step's aggregate result, indistinguishable
      # from a failure in any other scripts/*.test.mjs file.
      - name: Unit tests (scripts/refresh-excluded-lockfiles.test.sh)
        run: pnpm run test:refresh-lockfiles
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `pnpm install --frozen-lockfile` exits 0 even when the file: link
      # above silently failed to resolve (#2479), so this checks the
      # runtime result immediately rather than let a failed link surface
      # several confusing steps later (e.g. "vitest: not found"). #2504's
      # first bullet: this is the runtime counterpart to
      # `every_pnpm_install_lane_builds_wasm_first_in_the_same_job`, which
      # only checks the workflow's step ORDER, not that the install
      # actually linked correctly at that order.
      - run: pnpm run check:wasm-pkg
      - name: Typecheck (@brink-lang/editor)
        run: pnpm --filter @brink-lang/editor typecheck
      - name: Typecheck
        run: pnpm --filter @brink-lang/studio typecheck
      # ink-editor's own suite (#2559) — runs before the studio suite so a
      # regression in the published editor package is attributed to the
      # right package's CI step rather than surfacing only as a studio
      # failure. Its vitest.config.ts needs no wasm alias (see that file's
      # header comment), so this step needs no built wasm AT TEST-RUN TIME;
      # the workspace install in this job still does (#2479).
      - name: Unit tests (vitest, @brink-lang/editor)
        run: pnpm --filter @brink-lang/editor test
      - name: Unit tests (vitest)
        run: pnpm --filter @brink-lang/studio test
      - name: Unit tests (vitest, @brink-lang/web wrapper)
        run: pnpm --filter @brink-lang/web test
      - name: Unit tests (vitest, @brink/desktop)
        run: pnpm --filter @brink/desktop test

  # The Playwright suite is the CI wall-clock long pole (#402): ~384 tests at
  # ~5m40s serial. Sharded across independent runners; each shard rebuilds the
  # wasm bundle itself (rust-cache makes that ~1m) rather than waiting on an
  # artifact handoff, so shards start at t=0 and the job is pure fan-out.
  e2e:
    name: E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Hard backstop against the 360-minute Actions default (#2697): each
    # shard rebuilds wasm, installs Playwright's browser, then runs its
    # quarter of the ~5m40s serial suite.
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.14.0
      # Same file: dependency ordering as the `frontend` job above (#2479);
      # `every_pnpm_install_lane_builds_wasm_first_in_the_same_job`
      # (packages/brink-desktop/src-tauri/src/lib.rs, #2504) covers this job too.
      - name: Build brink-web wasm package
        run: wasm-pack build crates/brink-web --target web --out-dir www/pkg
      # No `version:` input on purpose (#2604): with it omitted the action reads
      # root package.json's `packageManager` field, so corepack, this lane and
      # scripts/setup-dev.sh all resolve ONE exact pnpm version. Pinning only a
      # major here made which 10.x a runner got ambient, and the same missing
      # `crates/brink-web/www/pkg` link produced two different failure shapes
      # across that range (#2479/#2492 exit 0 vs #2593/#2596 exit 1).
      # `scripts/check-pnpm-pin.mjs` (via `pnpm test:scripts`) fails if a
      # `version:` input reappears here disagreeing with the pin.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # See the `frontend` job's identical step above (#2504's first
      # bullet, #2479).
      - run: pnpm run check:wasm-pkg
      - name: Install Playwright browser
        run: pnpm --filter @brink-lang/studio exec playwright install --with-deps chromium
      - name: E2E tests (Playwright, shard ${{ matrix.shard }}/4)
        run: pnpm --filter @brink-lang/studio exec playwright test --shard=${{ matrix.shard }}/4

  # Fan-in gate so branch protection can require ONE stable check name ("E2E")
  # instead of tracking per-shard matrix names.
  e2e-gate:
    name: E2E
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    # Hard backstop against the 360-minute Actions default (#2697): a
    # trivial fan-in check of the matrix result above.
    timeout-minutes: 5
    steps:
      - name: All shards passed
        run: test "${{ needs.e2e.result }}" = "success"
