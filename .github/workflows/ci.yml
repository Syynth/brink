name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # bevy-brink's `bevy` dev-dependency (windowed `play_story` example) pulls
      # in wayland-sys/winit/alsa, whose build scripts need these system libs.
      # `cargo test` compiles examples, so they're required here.
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # `--all-targets` compiles the bevy examples, which need bevy's Linux
      # system libs (wayland-sys build script, etc.).
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  book:
    name: Book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install mdbook --locked
      - run: mdbook build docs/book

  frontend:
    name: Frontend (brink-studio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
      # The @brink/wasm package is a file: dependency on the wasm-pack output,
      # so the bundle must be built BEFORE `pnpm install` can link it.
      - name: Build brink-web wasm package
        run: wasm-pack build crates/brink-web --target web --out-dir www/pkg
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @brink/studio typecheck
      - name: Unit tests (vitest)
        run: pnpm --filter @brink/studio test
      - name: Install Playwright browser
        run: pnpm --filter @brink/studio exec playwright install --with-deps chromium
      - name: E2E tests (Playwright)
        run: pnpm --filter @brink/studio test:e2e
