name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repo. Grant more per-job if ever needed.
permissions: {}

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to full commit SHAs (mutable tags can be
# repointed at malicious code). The trailing comment tracks the version;
# Dependabot bumps both together.
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check --workspace
      # The wasm-side test modules (`wasm_bindgen_test`) were compiled by no
      # CI job — only the lib was ever checked for wasm32 — so they bitrotted
      # invisibly when PR #654's module split broke their `super::` paths
      # (#672 lane G finding). Compile them here; the `wasm-test` job below
      # actually *executes* them (#672 workstream D).
      - run: cargo check -p brink-web --all-targets --target wasm32-unknown-unknown

  # Executes the `#[wasm_bindgen_test]` suite under Node (the `check` job
  # above only type-checks it for wasm32 — it never ran, so PR #620's
  # Record→null marshal regression would not have been caught by any CI
  # job). All 49 tests here go through `web_sys::console::*` at most — no
  # `window`/`document`/`fetch`/storage — so Node's built-in `console`
  # satisfies every dependency and no headless browser is needed. If this
  # job proves flaky in practice, drop it from branch-protection's required
  # list rather than deleting it (#672 workstream D).
  wasm-test:
    name: Wasm Tests (brink-web)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        # Pin the version (matching the `frontend` job below): the default
        # `latest` queries the GitHub API for the newest release and breaks
        # under API rate limiting (HTML, not JSON).
        with:
          version: v0.14.0
      - run: wasm-pack test --node crates/brink-web

  # `brink-format` and `brink-runtime` claim `no_std` + `alloc` portability
  # (`docs/no-std-portability.md`, #434): both have a default-enabled `std`
  # feature and fall back to `core`/`alloc` without it. No job ever built
  # that configuration, so it rotted silently — `proj_ops.rs`'s `.to_owned()`
  # call shipped without the `alloc::borrow::ToOwned` import and broke
  # `cargo check -p brink-runtime --no-default-features` on main with no CI
  # signal (#1135). One job per crate (matrix, fail-fast: false) so a break
  # in one crate's no_std build doesn't hide a break in the other's.
  no-std:
    name: no_std (${{ matrix.crate }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        crate: [brink-format, brink-runtime]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: no-std-${{ matrix.crate }}
      - run: cargo check -p ${{ matrix.crate }} --no-default-features

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # bevy-brink's `bevy` dev-dependency (windowed `play_story` example) pulls
      # in wayland-sys/winit/alsa, whose build scripts need these system libs.
      # `cargo test` compiles examples, so they're required here.
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # bevy-brink (+ bevy-brink-derive) is EXCLUDED from the CI gate: the bevy
      # dependency graph is the dominant build cost and its examples link a
      # 300+ rlib binary that intermittently crashes the runner's linker (ld
      # bus error). Parser/compiler PRs never touch it. Test bevy-brink locally
      # or via an on-demand job when changing it. (2026-07-20)
      - run: cargo test --workspace --exclude bevy-brink --exclude bevy-brink-derive

  # `--features bench-counters` is off by default (it's a compile-time cut,
  # not a runtime toggle — see `crates/brink-runtime/src/bench_counters.rs`),
  # so the `test` job above never builds or runs anything gated on it. PR
  # #921's counter-forwarding proofs
  # (`collection_global_axis_forwards_nonzero_counters` plus the
  # bench-counters-gated scenario-story compile+run) only ever ran locally
  # until this job existed (#923, tracked from #897). A separate job (not a
  # step folded into `test`) so its own distinct feature/cache combination is
  # visible in the checks list and a failure here can't be masked by the
  # default-feature run passing.
  test-bench-counters:
    name: Test (bench-counters)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Same bevy-brink dev-dependency system libs as the `test` job above.
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: bench-counters
      # bevy-brink dropped from CI (see the `test` job) — keep brink-runtime's
      # bench-counters coverage, which is cheap and bevy-free.
      - run: cargo test -p brink-runtime --features bench-counters

  # #956 (tracked from #897): the standard `clippy`/`test` jobs below only
  # ever build the workspace's *default* feature sets, so a feature-gated
  # module can bitrot invisibly. That's exactly how #765's xliff2 CDATA gap
  # (found by a hand-run `clippy --all-features`) and #923's bench-counters
  # gap got in — each closed one feature at a time (`test-bench-counters`
  # above). One `--all-features` leg closes the whole class at once instead
  # of chasing each gap after the fact.
  #
  # Feature unification across the workspace made `--workspace --all-features`
  # feasible here (verified: no combination conflicts among xliff2's
  # `metadata`, brink-format's `inkt`/`std`, brink-runtime's
  # `bench-counters`/`effect-trace`/`testing`, bevy-brink's
  # `dev`/`bench-counters`/`effect-trace`, brink-db's `memory-introspection`,
  # or brink-test-harness's `effect-trace` forwarding) — if a future feature
  # ever proves mutually exclusive workspace-wide, fall back to a per-crate
  # `-p` matrix here rather than dropping the leg.
  #
  # This subsumes #947 (a proposed `--features effect-trace` leg for
  # brink-runtime + bevy-brink): both crates' `effect-trace` feature is part
  # of `--all-features`, so their ground-truth tests
  # (`brink-runtime::effect_trace`'s recorder-backed assertions and
  # `bevy-brink::ground_truth`'s `#[cfg(test)]` module, gated by
  # `#[cfg(feature = "effect-trace")] mod ground_truth;` in
  # `crates/bevy-brink/src/lib.rs`) already run here — no separate job
  # needed.
  clippy-all-features:
    name: Clippy (all features)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Same bevy-brink dev-dependency system libs as the `test` job above.
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: all-features
      - run: cargo clippy --workspace --all-targets --all-features --exclude bevy-brink --exclude bevy-brink-derive -- -D warnings

  # Companion to `clippy-all-features` above — see its comment for why this
  # leg exists and how it subsumes #947. Runtime cost measured comparable to
  # the default `test` job (workspace test compile dominates; the extra
  # feature-gated test functions are a handful of fast unit/integration
  # tests), so it runs `cargo test`, not just clippy.
  test-all-features:
    name: Test (all features)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Same bevy-brink dev-dependency system libs as the `test` job above.
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: all-features
      - run: cargo test --workspace --all-features --exclude bevy-brink --exclude bevy-brink-derive

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # `--all-targets` compiles the bevy examples, which need bevy's Linux
      # system libs (wayland-sys build script, etc.).
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets --exclude bevy-brink --exclude bevy-brink-derive -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Supply-chain gate: advisories, licenses, banned crates, source allowlist.
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check

  # Publishability pre-flight (#1232). crates.io Trusted Publishing tokens can
  # publish a new VERSION of an existing crate but CANNOT CREATE one — the first
  # publish of any new crate must be done by hand. When `brink-syntax-native`
  # landed as a publishable crate that had never been on crates.io, release-plz
  # aborted the ENTIRE workspace release on it, and every crate release silently
  # failed for two days (18 consecutive runs) before anyone noticed — `npm-release`
  # kept succeeding, so nothing looked broken.
  #
  # This job makes that failure loud and immediate, on the PR that introduces the
  # crate rather than on main after the fact. It checks every workspace member
  # that is publishable (`publish` unset/true) and fails if crates.io has never
  # heard of it.
  publishable:
    name: Publishable crates exist on crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check each publishable crate is known to crates.io
        run: |
          set -euo pipefail
          # `cargo metadata` reports `publish: null` for unrestricted (the
          # workspace default) and `publish: []` for `publish = false`.
          crates=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.publish == null) | .name' | sort)
          echo "Publishable workspace crates:"; echo "$crates" | sed 's/^/  - /'
          missing=""
          for crate in $crates; do
            # crates.io requires a descriptive User-Agent; anonymous curl is refused.
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "brink-ci (https://github.com/Syynth/brink)" \
              "https://crates.io/api/v1/crates/${crate}")
            case "$code" in
              200) echo "ok: ${crate}" ;;
              404) echo "MISSING: ${crate}"; missing="${missing} ${crate}" ;;
              # Don't fail the build on a flaky registry or a rate limit — this
              # guard exists to catch a new crate, not to gate on crates.io uptime.
              *)   echo "::warning::${crate}: unexpected status ${code} from crates.io; skipping" ;;
            esac
            sleep 1
          done
          if [ -n "${missing}" ]; then
            echo "::error::These crates are publishable but have never been published to crates.io:${missing}"
            echo "::error::crates.io Trusted Publishing CANNOT create a new crate, so release-plz will abort the whole workspace release."
            echo "::error::Fix by EITHER setting 'publish = false' in the crate's Cargo.toml, OR having a maintainer run 'cargo publish -p <crate>' once by hand."
            exit 1
          fi

  # Bounded fuzz smoke runs (#672 workstream C) — not continuous fuzzing
  # campaigns. Each target gets a fresh ephemeral corpus dir (uncommitted;
  # new finds land there, never in the committed seed corpus under
  # `fuzz/seeds/<target>/`) plus the curated seeds, and a short
  # `-max_total_time` budget. This catches panics/hangs in the parser and
  # the VM's malformed-bytecode handling cheaply on every PR; a real
  # coverage-guided campaign is a local/scheduled concern, not a per-PR one.
  #
  # One job per target (matrix, fail-fast: false) rather than sequential
  # steps in a shared job: a crash in one target must not skip the others —
  # sequential steps stop at the first failing step, silently leaving later
  # targets (e.g. the VM's vm_no_panic) unexercised while CI still reports
  # red for an unrelated reason.
  #
  # `-seed=` is pinned per target so the mutation sequence explored each
  # run is reproducible for a given corpus/binary — libFuzzer's default
  # randomized seed would otherwise let each PR (including unrelated ones)
  # explore a different slice of the input space and risk surfacing a fresh
  # shallow crash as a flake, in tension with #672 workstream F's zero-flake
  # mandate.
  fuzz:
    name: Fuzz (smoke) — ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: parse_no_panic
            crate_dir: crates/internal/brink-syntax/fuzz
            seed_dir: seeds/ink
          - target: parse_lossless
            crate_dir: crates/internal/brink-syntax/fuzz
            seed_dir: seeds/ink
          - target: vm_no_panic
            crate_dir: crates/brink-runtime/fuzz
            seed_dir: seeds/vm_no_panic
          # brink-format's 6 targets (#745) — never previously wired into
          # this matrix despite existing in-tree. The two shared seed
          # dirs mirror the shape above: `seeds/inkb` for the four targets
          # that take a `.inkb` byte buffer, `seeds/inkt` for the two that
          # take a `.inkt` string, same as brink-syntax's single
          # `seeds/ink` dir shared by its two `&str`-input targets.
          - target: read_no_panic
            crate_dir: crates/internal/brink-format/fuzz
            seed_dir: seeds/inkb
          - target: write_read_roundtrip
            crate_dir: crates/internal/brink-format/fuzz
            seed_dir: seeds/inkb
          - target: read_index_no_panic
            crate_dir: crates/internal/brink-format/fuzz
            seed_dir: seeds/inkb
          - target: section_reads_no_panic
            crate_dir: crates/internal/brink-format/fuzz
            seed_dir: seeds/inkb
          - target: read_inkt_no_panic
            crate_dir: crates/internal/brink-format/fuzz
            seed_dir: seeds/inkt
          - target: inkt_write_read_roundtrip
            crate_dir: crates/internal/brink-format/fuzz
            seed_dir: seeds/inkt
    # Hard backstop independent of the target's own `-max_total_time`
    # budget (30s of intended fuzz time) — if a target ever fails to
    # self-terminate, the job dies here instead of burning CI minutes
    # silently.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: fuzz-${{ matrix.target }}
      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        working-directory: ${{ matrix.crate_dir }}
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} ${{ matrix.seed_dir }} -- -seed=1 -max_total_time=30 -max_len=8192

  # BH-3's determinism law (#927, closing #926): the parallel batch driver
  # must be byte-identical to the serial driver, in flow-id order, over
  # randomized workloads. It already runs inside the `test` job's
  # `cargo test --workspace` above, but sharing that job means a law
  # violation is just one more failure buried in a huge workspace test blob
  # instead of naming itself in the checks list (#897, tracked to #940).
  #
  # Same fuzz-smoke shape as the `fuzz` matrix above: an independent job (not
  # a step folded into `test`), a seed PINNED via env var rather than left to
  # the test's hardcoded default (reproducible across runs, and the matrix
  # shape lets a future PR add more pinned-seed lanes without any one
  # violation silently skipping the others), and a modest fixed iteration
  # budget (64 randomized workloads) — this is a correctness gate on every
  # PR, not a soak/fuzz campaign.
  determinism-law:
    name: Determinism law (BH-3) — seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 918273645
            iterations: 64
    # Hard backstop: this test is a handful of seconds of work, so a hang
    # here means the parallel driver deadlocked, not that the budget was too
    # tight.
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BRINK_DETERMINISM_LAW_SEED: ${{ matrix.seed }}
      BRINK_DETERMINISM_LAW_ITERATIONS: ${{ matrix.iterations }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Same bevy-brink dev-dependency system libs as the `test` job above.
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: determinism-law-${{ matrix.seed }}
      - name: Determinism law (pinned seed ${{ matrix.seed }}, ${{ matrix.iterations }} iterations)
        run: cargo test -p bevy-brink --lib batch::tests::parallel_equals_serial_over_randomized_workloads -- --exact

  book:
    name: Book
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # bevy-brink (built below for the Bevy doctests' -L path) transitively
      # needs these system libs via its bevy_* deps' build scripts.
      #
      # No rust-cache here on purpose: the doctest deps go in a non-default
      # target dir and are consumed by rustdoc, which rejects artifacts built by
      # a different rustc (E0514) — a restored cache from an older toolchain
      # breaks the run. The build below is always fresh.
      #
      # The Bevy *flows* page is `{{#include}}`d from crates/bevy-brink/examples/
      # book_flows.rs and compile-checked by the `test` job (cargo test compiles
      # examples), so it needs no step here.
      - name: Install Linux dependencies (bevy)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo install mdbook --locked
      - run: mdbook build docs/book
      # Compile the book's Rust examples as doctests. Without this, a signature
      # change can silently rot every example in the book — which is exactly
      # what happened to `Story::new` across the Program → Arc refactor.
      #
      # One cargo invocation for the whole package set: rustdoc resolves the
      # examples off -L, and two builds of a crate with different hashes make
      # it bail with E0464. See the `book-test` recipe in the justfile.
      - run: cargo build -p brink-runtime -p brink-compiler -p brink-format -p brink-intl -p bevy-brink -p brink-project-config
        env:
          CARGO_TARGET_DIR: target/book-doctest
      # Run mdbook under the pinned toolchain (rust-toolchain.toml). `cargo
      # build` above honors the pin, but mdbook's rustdoc subprocess otherwise
      # picks up the runner's default toolchain — a rustc-version mismatch that
      # makes rustdoc reject the freshly-built deps (E0514).
      #
      # CARGO_MANIFEST_DIR: Bevy's derives resolve the `bevy` vs `bevy_ecs` crate
      # path from the manifest, and rustdoc runs outside a cargo context.
      - name: mdbook test (doctests)
        run: |
          channel=$(grep -oE 'channel = "[^"]+"' rust-toolchain.toml | cut -d'"' -f2)
          rustup run "$channel" mdbook test docs/book -L target/book-doctest/debug/deps
        env:
          CARGO_MANIFEST_DIR: ${{ github.workspace }}/crates/bevy-brink
      # Type-check the book's TypeScript examples against the published
      # @brink-lang packages (the TS counterpart of `mdbook test`).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: docs/book/ts-check
      - run: npm run check
        working-directory: docs/book/ts-check

  frontend:
    name: Frontend (brink-studio)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        # Pin the version (matching npm-release.yml): the default `latest`
        # queries the GitHub API for the newest release and breaks under API
        # rate limiting (HTML, not JSON).
        with:
          version: v0.14.0
      # The @brink-lang/web package is a file: dependency on the wasm-pack output,
      # so the bundle must be built BEFORE `pnpm install` can link it.
      - name: Build brink-web wasm package
        run: wasm-pack build crates/brink-web --target web --out-dir www/pkg
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @brink-lang/studio typecheck
      - name: Unit tests (vitest)
        run: pnpm --filter @brink-lang/studio test
      - name: Unit tests (vitest, @brink-lang/web wrapper)
        run: pnpm --filter @brink-lang/web test

  # The Playwright suite is the CI wall-clock long pole (#402): ~384 tests at
  # ~5m40s serial. Sharded across independent runners; each shard rebuilds the
  # wasm bundle itself (rust-cache makes that ~1m) rather than waiting on an
  # artifact handoff, so shards start at t=0 and the job is pure fan-out.
  e2e:
    name: E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.14.0
      - name: Build brink-web wasm package
        run: wasm-pack build crates/brink-web --target web --out-dir www/pkg
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @brink-lang/studio exec playwright install --with-deps chromium
      - name: E2E tests (Playwright, shard ${{ matrix.shard }}/4)
        run: pnpm --filter @brink-lang/studio exec playwright test --shard=${{ matrix.shard }}/4

  # Fan-in gate so branch protection can require ONE stable check name ("E2E")
  # instead of tracking per-shard matrix names.
  e2e-gate:
    name: E2E
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: All shards passed
        run: test "${{ needs.e2e.result }}" = "success"
