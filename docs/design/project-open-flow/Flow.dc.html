<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif;
           background: #181825; color: #cdd6f4; -webkit-font-smoothing: antialiased; }
    a { color: #89b4fa; } a:hover { color: #b4ccfd; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .cap { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #6c7086; }
  </style>
</helmet>
<div style="width: 1120px; height: 470px; background: #181825; padding: 26px 30px;
            display: flex; flex-direction: column; gap: 20px; box-sizing: border-box;">

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="font-size: 17px; font-weight: 550;">Two doors, both files</div>
    <div style="font-size: 12px; color: #6c7086;">
      A project is anchored on a file, never a folder — so it cannot be opened without an entry point.
    </div>
  </div>

  <div style="display: flex; gap: 14px; align-items: stretch; flex-grow: 1;">

    <sc-for list="{{paths}}" as="p" hint-placeholder-count="3">
      <div style="flex-grow: 1; flex-basis: 0; border: 1px solid {{p.border}}; border-radius: 7px;
                  background: #1e1e2e; display: flex; flex-direction: column; overflow: hidden;">

        <div style="padding: 12px 14px; border-bottom: 1px solid #313244;
                    display: flex; align-items: center; gap: 8px;">
          <div style="width: 7px; height: 7px; border-radius: 2px; background: {{p.tint}};"></div>
          <div style="font-size: 12px; font-weight: 600; color: #cdd6f4;">{{p.title}}</div>
        </div>

        <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1;">
          <sc-for list="{{p.steps}}" as="s" hint-placeholder-count="3">
            <div style="display: flex; gap: 9px; align-items: flex-start;">
              <div class="mono" style="font-size: 10px; color: #45475a; margin-top: 2px;
                                       flex-shrink: 0;">{{s.n}}</div>
              <div style="font-size: 11.5px; line-height: 1.5; color: {{s.tint}};">{{s.text}}</div>
            </div>
          </sc-for>
        </div>

        <div style="padding: 10px 14px; border-top: 1px solid #313244; background: #1a1a28;">
          <div style="font-size: 11px; color: {{p.outTint}}; line-height: 1.45;">{{p.out}}</div>
        </div>
      </div>
    </sc-for>

  </div>

  <div style="display: flex; gap: 22px; padding-top: 2px;">
    <sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; gap: 8px; align-items: flex-start; flex-basis: 0; flex-grow: 1;">
        <div style="color: {{r.tint}}; font-size: 11px; margin-top: 1px;">—</div>
        <div style="font-size: 11px; line-height: 1.5; color: #a6adc8;">{{r.text}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const dim = '#a6adc8';
    return {
      paths: [
        { title: 'Open a .ink file', tint: '#cba6f7', border: '#4a3d63', outTint: '#cba6f7',
          steps: [
            { n: '1', text: 'That file becomes the entry point.', tint: dim },
            { n: '2', text: 'Walk up for a governing brink.toml, as the compiler does.', tint: dim },
            { n: '3', text: 'If one governs, warn — and offer a one-click switch when the file is its declared entry.', tint: dim },
          ],
          out: 'The explicit open wins. The warning is what keeps that from being silent.' },

        { title: 'Open a brink.toml', tint: '#89b4fa', border: '#3a4a6b', outTint: '#89b4fa',
          steps: [
            { n: '1', text: 'Its [project] entry names the entry file.', tint: dim },
            { n: '2', text: 'Lints and conventions come along.', tint: dim },
            { n: '3', text: 'Editable through a form, not raw TOML.', tint: dim },
          ],
          out: 'The full-fidelity project. Everything a file-anchored one has, plus config.' },

        { title: 'New Project', tint: '#a6e3a1', border: '#3d5a44', outTint: '#a6e3a1',
          steps: [
            { n: '1', text: 'Pick a folder.', tint: dim },
            { n: '2', text: 'Creates main.ink and brink.toml together.', tint: dim },
            { n: '3', text: 'Opens on the toml door.', tint: dim },
          ],
          out: 'A new project is never born in the broken state that started all this.' },
      ],
      rules: [
        { tint: '#f9e2af', text: 'Upgrading a file-anchored project rewrites its recents entry in place — one entry, never two.' },
        { tint: '#89dceb', text: 'Anything shown but outside the compile closure says so, in the editor and in the binder.' },
        { tint: '#6c7086', text: 'Native (.brink) is deferred; this is the ink flow.' },
      ],
    };
  }
}
</script>
</body>
</html>
