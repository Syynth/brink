<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif;
           background: #1e1e2e; color: #cdd6f4; -webkit-font-smoothing: antialiased; }
    a { color: #89b4fa; } a:hover { color: #b4ccfd; }
    .k { font: 500 11px system-ui, sans-serif; letter-spacing: .08em;
         text-transform: uppercase; color: #6c7086; }
  </style>
</helmet>
<div style="width: 880px; height: 690px; background: #1e1e2e; display: flex;
            flex-direction: column; overflow: hidden;">

  <!-- title bar, matching the shell chrome -->
  <div style="height: 30px; background: #2a2a3d; border-bottom: 1px solid #45475a;
              display: flex; align-items: center; padding: 0 12px; gap: 8px; flex-shrink: 0;">
    <div style="display: flex; gap: 6px;">
      <div style="width: 11px; height: 11px; border-radius: 50%; background: #f38ba8;"></div>
      <div style="width: 11px; height: 11px; border-radius: 50%; background: #f9e2af;"></div>
      <div style="width: 11px; height: 11px; border-radius: 50%; background: #a6e3a1;"></div>
    </div>
    <div style="font-size: 12px; color: #6c7086; margin-left: 6px;">Brink Studio</div>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;
              padding: 0 64px; background:
              radial-gradient(120% 80% at 50% -10%, #23233a 0%, #1e1e2e 55%);">
    <div style="width: 100%; max-width: 560px; display: flex; flex-direction: column;
                align-items: center; gap: 30px;">

      <!-- Lockup: the real app icon (brink-icon-night.svg — the night squircle users
           see in the Dock), then the name. Centred so the mark anchors the screen
           instead of floating beside the copy. -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
        <svg width="84" height="84" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"
             style="filter: drop-shadow(0 10px 26px rgb(0 0 0 / .5));" aria-label="Brink Studio">
          <path d="M60,0 C12,0 0,12 0,60 C0,108 12,120 60,120 C108,120 120,108 120,60 C120,12 108,0 60,0 Z"
                fill="#101420"></path>
          <g transform="translate(23.6,28) scale(0.727)">
            <path d="M50 0 C54 10 65.6 23.4 74.94 37.34 A30 30 0 1 1 25.06 37.34 C34.4 23.4 46 10 50 0 Z"
                  fill="#7E96FF"></path>
            <path d="M36 54 L56 54 M50 43 L62 54 L50 65" fill="none" stroke="#101420"
                  stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </g>
        </svg>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
          <div style="font-size: 25px; font-weight: 300; letter-spacing: .005em; color: #cdd6f4;">
            Brink Studio</div>
          <div style="font-size: 12.5px; color: #6c7086; text-align: center;">
            Open a story file or a project config to begin.</div>
        </div>
      </div>

      <!-- the two doors -->
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
                  gap: 10px; width: 100%;">
        <sc-for list="{{doors}}" as="d" hint-placeholder-count="2">
          <div style="border: 1px solid #45475a; border-radius: 7px; background: #252536;
                      padding: 14px 15px; display: flex; flex-direction: column; gap: 7px;
                      cursor: pointer;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="width: 6px; height: 6px; border-radius: 2px; background: {{d.tint}};"></div>
              <div style="font-size: 12.5px; font-weight: 600; color: #cdd6f4;">{{d.title}}</div>
            </div>
            <div style="font-size: 11.5px; line-height: 1.5; color: #6c7086;">{{d.body}}</div>
          </div>
        </sc-for>
      </div>

      <!-- recents -->
      <div style="display: flex; flex-direction: column; gap: 7px; width: 100%;">
        <div class="k">Recent</div>
        <div style="display: flex; flex-direction: column; border: 1px solid #45475a;
                    border-radius: 7px; overflow: hidden; background: #1c1c2b;">
          <sc-for list="{{recents}}" as="r" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px;
                        background: {{r.bg}}; border-bottom: 1px solid #2a2a3d;">
              <div style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                          font-size: 8.5px; letter-spacing: .07em; color: {{r.kindTint}};
                          border: 1px solid {{r.kindBorder}}; border-radius: 3px;
                          padding: 2px 5px; flex-shrink: 0;">{{r.kind}}</div>
              <div style="font-size: 12px; color: #cdd6f4; flex-grow: 1;">{{r.name}}</div>
              <div style="font-size: 10.5px; color: #585b70;
                          font-family: ui-monospace, Menlo, monospace;">{{r.path}}</div>
            </div>
          </sc-for>
        </div>
      </div>

      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <div style="width: 13px; height: 13px; border-radius: 3px; border: 1px solid #585b70;
                    background: #1a1a28;"></div>
        <span style="font-size: 11.5px; color: #7f849c;">Reopen last project on launch</span>
      </label>

    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const doc = (c) => ({ __html: c });
    return {
      doors: [
        { title: 'New Project…', tint: '#a6e3a1',
          body: 'Pick a folder. Creates main.ink and brink.toml, ready to play.',
          icon: 'NEW' },
        { title: 'Open…', tint: '#89b4fa',
          body: 'Open a .ink file — it becomes the entry point — or a brink.toml.',
          icon: 'OPEN' },
      ],
      recents: [
        { kind: 'TOML', name: 'Harbour Lights', path: '~/stories/harbour',
          bg: '#252536', kindTint: '#89b4fa', kindBorder: '#3a4a6b' },
        { kind: 'INK', name: 'prologue.ink', path: '~/drafts/nightjar',
          bg: '#1e1e2e', kindTint: '#cba6f7', kindBorder: '#4a3d63' },
        { kind: 'INK', name: 'scratch.ink', path: '~/scratch',
          bg: '#1e1e2e', kindTint: '#cba6f7', kindBorder: '#4a3d63' },
      ],
    };
  }
}
</script>
</body>
</html>
