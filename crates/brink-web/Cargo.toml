[package]
name = "brink-web"
description = "WASM bindings for brink IDE and runtime — powers the web playground"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
brink-compiler = { workspace = true }
brink-db = { workspace = true }
# The #1306 producer: `Project::load(&tree, entry, &overrides)` ->
# `compile(&env)` — the pure/effectful split `compile()`/`compile_fragment()`
# (crates/brink-web/src/compile.rs) migrate onto, replacing the throwaway
# `Driver` + `set_file`/`set_entry`/`set_analysis_options` imperative path.
brink-environment = { workspace = true }
brink-ide = { workspace = true }
brink-runtime = { workspace = true }
brink-syntax = { workspace = true }
brink-analyzer = { workspace = true }
brink-ir = { workspace = true }
# `InMemory`: the map-backed `SourceTree` — the web mount's natural home,
# since compile.rs's documents already live in memory.
brink-source-tree = { workspace = true }
# `brink.toml` project settings file (#1005): `parse_str` for
# `EditorSession::apply_project_config` (text handed in by an embedder that
# reads the file with its own host APIs) and, since #1414,
# `discover_from_entry_in_tree` for `EditorSession::discover_project_config`
# (walks the session's in-memory `SourceTree` — still no real fs use, since
# the wasm sandbox has none of its own).
brink-project-config = { workspace = true }
# `inkt-write` exposes the dependency-free `.inkt` writer for the Program
# Explorer (`StoryRunner::program_inkt`) — no `pest` reader pulled into the wasm.
brink-format = { workspace = true, features = ["inkt-write"] }
# The compiled lines-table export (`StoryRunner::lines_table`, #366) reuses
# the same `LinesJson` shape the `export-xliff` CLI path produces — one
# project-wide, INCLUDEs-resolved table of text + source span, already
# built for translator consumption. No filesystem use in this crate (pure
# `StoryData` → JSON transform), so it's wasm-safe.
brink-intl = { workspace = true }
rowan.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasm-bindgen = "0.2"
# `js-sys` provides `Function`/`Array` for the synchronous external-function
# binding boundary (ink EXTERNAL → JS callback). Values are hand-mapped to
# native JS (number/bool/string/null), not serialized, so no serde-wasm-bindgen.
js-sys = "0.3"
# MessagePack (struct-map mode) for the compact `save_bytes`/`load_bytes`
# release path; the `save`/`load` JSON path uses serde_json (above).
rmp-serde = "1"
# `console.warn` for the reentrancy guard and the throwing-binding warn — the
# one logging path the crate otherwise lacks.
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
# Drives the `#[wasm_bindgen_test]` suite (run via `wasm-pack test --node`),
# which exercises the external-binding JS boundary end-to-end.
wasm-bindgen-test = "0.3"
# Lets the async wasm test `await` a JS `Promise` (`JsFuture`) on the Rust side.
wasm-bindgen-futures = "0.4"

[lints]
workspace = true
