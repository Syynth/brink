[package]
name = "brink-web"
description = "WASM bindings for brink IDE and runtime — powers the web playground"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
brink-compiler = { workspace = true }
brink-db = { workspace = true }
brink-ide = { workspace = true }
# `testing` exposes brink-runtime's read-only debug accessors (Story::debug_state,
# Program::global_name) used by the studio State View. The feature is purely
# additive (`testing = []`, no behavior change). Interim until the structured
# DebugSnapshot API lands (see issue #62).
brink-runtime = { workspace = true, features = ["testing"] }
brink-syntax = { workspace = true }
brink-analyzer = { workspace = true }
brink-ir = { workspace = true }
brink-format = { workspace = true }
rowan.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"

[lints]
workspace = true
