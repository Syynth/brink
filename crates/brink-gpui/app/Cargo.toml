# Tier 3 of `docs/gpui-studio-spec.md` §2: the features, and `main`.
#
# Binder, Editor, Problems, Player, Program Explorer. Depends on the shell
# and the model; nothing depends on it.
[package]
name = "brink-gpui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
gpui-platform.workspace = true
gpui-kit-assets.workspace = true
lsp-types.workspace = true
anyhow.workspace = true
async-channel.workspace = true
rowan.workspace = true
regex.workspace = true
notify.workspace = true

brink-gpui-model.workspace = true
brink-gpui-shell.workspace = true

brink-ide.workspace = true
brink-intl.workspace = true
brink-db.workspace = true
brink-ir.workspace = true
brink-syntax.workspace = true
brink-analyzer.workspace = true
brink-driver.workspace = true
brink-project-config.workspace = true
serde.workspace = true
serde_json.workspace = true

# The headless harness (`src/harness.rs`, decision log 2026-10-03): the
# real Studio on gpui's test platform, with real text shaping and the
# Metal headless renderer for screenshots. Test-only, so none of it ships.
[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-platform = { workspace = true, features = ["test-support"] }
# Real text shaping that, unlike the macOS text system (reachable only
# through `MacPlatform`, which refuses any thread but main), runs on a test
# thread — and on Linux too.
gpui-wgpu = { version = "0.3.3", package = "gpui-pre-wgpu" }
# The same 0.25 line gpui renders into, so a screenshot is one `RgbaImage`
# type; `png` to write it.
image = { version = "0.25", default-features = false, features = ["png"] }
