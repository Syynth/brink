# The GPUI-native studio (decision log 2026-09-04, "The GPUI-native app is
# the destination").
#
# DELIBERATELY ITS OWN WORKSPACE (the empty `[workspace]` table below), and
# also named in the root workspace's `exclude` — both are needed, because the
# root's `crates/brink-*` members glob would otherwise pull gpui's entire
# dependency graph into every `cargo test --workspace` and every CI lane, for
# zero coverage benefit. Same arrangement as `packages/brink-desktop/src-tauri`,
# which only escapes by virtue of living outside the glob.
[package]
name = "brink-gpui"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# Zed's OWN gpui, from its repository, pinned to the exact commit
# `gpui-pre` 0.3.3 is a snapshot of (`zed@5b055fa`, 2026-09-03). The
# published `gpui` crate is stale (0.2.2, Oct 2025), so git is the only
# current path to it — which is what Zed's own README documents.
#
# `gpui-component`/`gpui-base` are VENDORED under `vendor/` with one edit
# each: their `gpui-pre*` dependencies repointed at the Zed packages those
# crates are snapshots of. A `[patch]` cannot do this — `gpui-pre` is
# versioned 0.3.x while Zed's `gpui` is 0.2.2, so the patch resolves and is
# then discarded as not satisfying `^0.3.1`.
gpui = { git = "https://github.com/zed-industries/zed", rev = "5b055fa789a8b8d38ac951a6e0cde272f66b4495", package = "gpui" }
gpui-component = { path = "vendor/gpui-component", features = ["tree-sitter"] }
# Must match gpui-base's lsp-types (the provider traits speak these types).
lsp-types = "0.97"
anyhow = "1"
# Same rowan the root workspace pins (TextSize/TextRange).
rowan = "0.16.1"

brink-ide = { path = "../internal/brink-ide" }
brink-db = { path = "../internal/brink-db" }
brink-ir = { path = "../internal/brink-ir" }
brink-analyzer = { path = "../internal/brink-analyzer" }
brink-driver = { path = "../internal/brink-driver" }
brink-project-config = { path = "../internal/brink-project-config" }
gpui-platform = { git = "https://github.com/zed-industries/zed", rev = "5b055fa789a8b8d38ac951a6e0cde272f66b4495", package = "gpui_platform", features = ["font-kit"] }
