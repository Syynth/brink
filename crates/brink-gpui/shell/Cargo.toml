# Tier 2 of `docs/gpui-studio-spec.md` §2: the shell.
#
# Regions, rails, docks, tabs, commands and layout persistence — plus the
# `Item`/`Panel` traits features implement. It depends on the model and MUST
# NOT depend on the feature crate: that edge is the one this split exists to
# prevent (Zed's `workspace` depends on `project`, never on `editor`).
[package]
name = "brink-gpui-shell"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
gpui-base.workspace = true
anyhow.workspace = true

brink-gpui-model.workspace = true
