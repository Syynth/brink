# Tier 1 of `docs/gpui-studio-spec.md` §2: the model.
#
# gpui, but NOT gpui-component — this crate holds state, emits events and
# spawns work, and renders nothing. The rule is Zed's: `project` is 82k
# lines of gpui-dependent, UI-free model, because gpui is the *application*
# framework (entities, executors, tasks), not the UI layer.
[package]
name = "brink-gpui-model"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
async-channel.workspace = true
anyhow.workspace = true
rowan.workspace = true
lsp-types.workspace = true

brink-ide.workspace = true
brink-db.workspace = true
brink-ir.workspace = true
brink-syntax.workspace = true
brink-syntax-native.workspace = true
brink-analyzer.workspace = true
brink-driver.workspace = true
brink-project-config.workspace = true
brink-environment.workspace = true
