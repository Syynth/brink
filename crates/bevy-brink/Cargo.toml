[package]
name = "bevy-brink"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bevy asset integration for brink ink stories"

# Render all features on docs.rs (the optional compiler/syntax bindings).
[package.metadata.docs.rs]
all-features = true

[dependencies]
brink-runtime = { workspace = true }
brink-format = { workspace = true }
bevy-brink-derive = { workspace = true }
brink-compiler = { workspace = true, optional = true }
brink-syntax = { workspace = true, optional = true }

bevy_app = { version = "0.19.0", default-features = false }
bevy_asset = { version = "0.19.0", default-features = false }
bevy_ecs = { version = "0.19.0", default-features = false }
bevy_input = { version = "0.19.0", default-features = false, features = ["std", "keyboard"] }
bevy_log = { version = "0.19.0", default-features = false }
bevy_reflect = { version = "0.19.0", default-features = false }
# Async-task bindings (bind_brink_task) spawn detached futures on
# AsyncComputeTaskPool and poll them via poll_once/block_on. `multi_threaded`
# matches what bevy_app's DefaultPlugins set up so spawned work runs off the
# main thread; `futures-lite` (default) supplies poll_once + block_on.
bevy_tasks = { version = "0.19.0", features = ["multi_threaded"] }

bon.workspace = true
serde.workspace = true
# Erases a HandleKind implementor's SaveKey type behind a uniform JSON
# payload so HandleSaveState can persist heterogeneous kinds in one table
# (T1d-3, docs/t1d-spec.md §4).
serde_json.workspace = true
thiserror.workspace = true

[features]
default = ["dev"]
# Dev mode: load `.ink` source files, compile at load time, hot-reload
# the program when any file in the transitive INCLUDE graph changes.
# Without this feature only compiled `.inkb` (and eventually `.inkl`,
# `.brkt`) assets are loadable — suitable for shipping a release binary
# that doesn't carry the brink compiler.
dev = ["dep:brink-compiler", "dep:brink-syntax"]
# Bench-only #821 Arc-clone/COW-copy debug counters, forwarded to
# brink-runtime (see `crates/brink-runtime/src/bench_counters.rs`,
# `docs/runtime-bench.md`). Off by default — compile-time cut, not a
# runtime toggle. Used by `benches/scenario_bench.rs` (issue #900).
bench-counters = ["brink-runtime/bench-counters"]
# Host-side ground-truth check (issue #938, the effect-trace pattern applied
# to the bevy boundary — see `crates/bevy-brink/src/ground_truth.rs`'s module
# docs). Off by default, exactly like `brink-runtime`'s own `effect-trace`
# feature (`crates/brink-runtime/src/effect_trace.rs`): an ordinary build
# pays exactly zero cost. When enabled, `bind_brink_query` captures each
# binding's real bevy-declared `Access` at registration time and every
# actual dispatch is recorded so a test/harness can assert it stays a subset
# of BH-1's manifest-declared row-join (`crates/bevy-brink/src/capability.rs`)
# — no `unsafe`, wraps the existing safe query-dispatch call site. Pulls in
# `bevy_ecs/debug` so `Components::get_name` resolves a real Rust type name
# for a violation's offending component instead of a placeholder string —
# required for this feature's own "name the component" acceptance bar.
effect-trace = ["bevy_ecs/debug"]

[dev-dependencies]
# The `play_story` example uses the bevy umbrella crate for windowing,
# UI, input, and the file_watcher feature that drives hot-reload.
bevy = { version = "0.19.0", features = ["file_watcher"] }
# Tests compile small inline ink stories to exercise the loader/replay
# code paths. brink-compiler is also pulled in via the `dev` feature
# in the regular dependency set, but adding it as a dev-dep means
# tests work even when someone disables default features.
brink-compiler = { path = "../brink-compiler" }
# Enable brink-runtime's `testing` feature so tests can introspect
# globals by name (Program::global_count, Program::global_name).
brink-runtime = { path = "../brink-runtime", features = ["testing"]  }
# The locale example + tests build `.inkl` overlays via the intl pipeline
# (export_lines + compile_locale).
brink-intl = { path = "../internal/brink-intl" }
# tests/manifest_field_convergence.rs (#911, BH follow-up deliverable 1)
# cross-validates one manifest JSON literal against both `capability::
# CapabilityManifest` (this crate) and `brink_ir::host_manifest::
# HostManifest` (the compiler/IDE-side type parsing the same on-disk
# file) — already a transitive dependency via the `brink-compiler` dev-dep
# above, so this adds no new build work, just a direct path to it.
brink-ir = { path = "../internal/brink-ir" }
# serde_json is a regular dependency now (handle.rs's SaveKey erasure); the
# `book_saves` example also round-trips a composed save map through it to
# prove `SaveState` really is Serialize/Deserialize end to end.

[[example]]
name = "play_story"
required-features = ["dev"]

# Headless demo of the engine↔ink dynamic binding facility
# (bind_brink_query / call_ink_function / commands.brink_call / advance_flow).
[[example]]
name = "engine_bindings"

# Headless demo of global, event-driven locale switching (.inkl overlays).
[[example]]
name = "locale_switch"

# Headless demo of .brkt transcript persistence (capture / reload / re-render).
[[example]]
name = "transcript_save"

# Headless demo of bind_brink_task: an async external resolved by a detached
# task on AsyncComputeTaskPool, across frames.
[[example]]
name = "async_task"

# Headless demo of bind_brink_async: the event+resolve primitive for a
# multi-frame World interaction (targeting UI), via BrinkExternalAwaited +
# resolve_brink_external.
[[example]]
name = "async_external"

# Scenario harness skeleton + SERIAL-driver baselines (issue #900, BH-B-1):
# headless MinimalPlugins runner, ScenarioConfig axes matrix, CSV+markdown
# baseline output. See the file's module docs for the honesty caveats.
# `test = false`: `cargo test` must not run this target's `main()` — it
# would execute the full 1/100/1k/10k baseline matrix and rewrite the
# checked-in baseline files as a side effect of an ordinary test run.
# Real `cargo test` coverage of the generator/driver logic lives in
# `tests/scenario_bench_model.rs` instead (includes the same source).
[[bench]]
name = "scenario_bench"
harness = false
test = false

[lints]
workspace = true
