[package]
name = "bevy-brink"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bevy asset integration for brink ink stories"

[dependencies]
brink-runtime = { path = "../brink-runtime" }
brink-format = { path = "../internal/brink-format" }
brink-compiler = { path = "../brink-compiler", optional = true }
brink-syntax = { path = "../internal/brink-syntax", optional = true }

bevy_app = { version = "0.18.1", default-features = false }
bevy_asset = { version = "0.18.1", default-features = false }
bevy_ecs = { version = "0.18.1", default-features = false }
bevy_log = { version = "0.18.1", default-features = false }
bevy_reflect = { version = "0.18.1", default-features = false }

thiserror.workspace = true

[features]
default = ["dev"]
# Dev mode: load `.ink` source files, compile at load time, hot-reload
# the program when any file in the transitive INCLUDE graph changes.
# Without this feature only compiled `.inkb` (and eventually `.inkl`,
# `.brkt`) assets are loadable — suitable for shipping a release binary
# that doesn't carry the brink compiler.
dev = ["dep:brink-compiler", "dep:brink-syntax"]

[lints]
workspace = true
