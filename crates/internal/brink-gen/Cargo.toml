[package]
name = "brink-gen"
description = "Story-level program generator: a typed story model, an .ink printer, and proptest strategies over the model (docs/program-generator-spec.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Test tooling, like brink-test-harness: never published.
publish = false

[dependencies]
proptest.workspace = true

[dev-dependencies]
# `test-util` (issue #2168): the smoke properties compile generated source
# inline through the legacy closure entry point, exactly as the harness does.
brink-compiler = { workspace = true, features = ["test-util"] }
brink-runtime = { workspace = true }
brink-test-harness = { workspace = true }
# The source-transformation equivalence properties (`tests/equivalence.rs`,
# docs/observable-semantics-spec.md §4.1): the formatter and the respeller
# are the transformations under test.
brink-fmt = { workspace = true }
brink-respell = { workspace = true }
# The optimizer equivalence property (`tests/opt_equivalence.rs`). The
# `test-control` feature carries the negative-control passes the non-vacuity
# half drives — see `brink_opt::control` for why the guard against one reaching
# a real artifact is a runtime assertion rather than this feature being off.
brink-opt = { workspace = true, features = ["test-control"] }

[lints]
workspace = true
