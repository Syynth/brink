[package]
name = "brink-analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Cross-file semantic analysis for inkle's ink narrative scripting language"

[dependencies]
brink-ir = { workspace = true }
# Owns the project-policy types (Dialect, TypePolicy) this crate re-exports —
# the edge points this way so brink-project-config can publish standalone (#1234).
brink-project-config = { workspace = true }
brink-format = { workspace = true }
brink-syntax = { workspace = true }
rowan.workspace = true
serde = { workspace = true }
# `conventions_confinement_diagnostics`'s "pointer resolves to no real
# project file" case (issue #2335) warns instead of silently dropping,
# mirroring `brink-db`'s own "warn, never silently drop" channel for the
# same case (`conventions_confinement_diagnostics_query`).
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
# B1 `or`-coalescing test fixtures (issue #1460): `InfixOp::Coalesce` is
# produced only by `hir::lower_native`, so `coalesce`'s own tests
# must parse through the native frontend rather than `brink-syntax` (the
# ink/brink-extension frontend every other check module's tests use).
brink-syntax-native = { workspace = true }

[lints]
workspace = true
