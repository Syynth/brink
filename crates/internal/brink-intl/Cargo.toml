[package]
name = "brink-intl"
description = "Internationalization tooling for brink stories"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
brink-format = { workspace = true }
icu_locale_core = { workspace = true }
icu_plurals = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
xliff2 = { workspace = true, features = ["metadata"] }

[dev-dependencies]
# `test-util` (issue #2168): tests here compile inline/fixture ink source
# directly, bypassing `brink_environment::compile(&Environment)` (#1306,
# the production road) — gated the same way every such test target is.
brink-compiler = { path = "../../brink-compiler", features = ["test-util"] }
brink-runtime = { path = "../../brink-runtime" }
insta = { workspace = true, features = ["json"] }
serde_json = { workspace = true }

[lints]
workspace = true
