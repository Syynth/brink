[package]
name = "brink-intl"
description = "Internationalization tooling for brink stories"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
brink-format = { workspace = true }
icu_locale_core = { workspace = true }
icu_plurals = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
xliff2 = { workspace = true, features = ["metadata"] }

[dev-dependencies]
# `test-util` (issue #2168): tests here compile inline/fixture ink source
# directly, bypassing `brink_environment::compile(&Environment)` (#1306,
# the production road) — gated the same way every such test target is.
brink-compiler = { path = "../../brink-compiler", features = ["test-util"] }
brink-runtime = { path = "../../brink-runtime" }
insta = { workspace = true, features = ["json"] }
serde_json = { workspace = true }

[features]
# Gate for this crate's examples, so a plain `cargo test` does not build and
# link them (docs/decision-log.md, "`cargo test` does not build examples").
# Run one with `cargo run -p brink-intl --features examples --example <name>`;
# `--all-features` (CI's clippy and test lanes) still builds every one.
examples = []

[[example]]
name = "generate_xliff"
required-features = ["examples"]

[lints]
workspace = true
