[package]
name = "brink-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Intermediate representations for inkle's ink narrative scripting language"

# Per-worktree build stamp for scripts/check-target-freshness.mjs (#2759) —
# see build.rs's own header for what it writes and why.
build = "build.rs"

[dependencies]
brink-syntax = { workspace = true }
brink-syntax-native = { workspace = true }
brink-format = { workspace = true }
rowan.workspace = true
bitflags.workspace = true
tracing.workspace = true
serde = { workspace = true }
thiserror.workspace = true
regex.workspace = true
regex-syntax.workspace = true

[dev-dependencies]
brink-analyzer = { path = "../brink-analyzer" }
brink-codegen-inkb = { path = "../brink-codegen-inkb" }
insta.workspace = true
serde_json.workspace = true
# D6 (issue #3184): `issue_3184_debug_info.rs`'s `.inkt` dump-parity test
# needs both directions — `brink-compiler`/`brink-test-harness` already
# enable the read side (`inkt`) elsewhere in the workspace, but a crate's
# own dev-dependency features should not depend on incidental leakage from
# an unrelated workspace member's build graph.
brink-format = { workspace = true, features = ["inkt", "inkt-write"] }

[lints]
workspace = true
