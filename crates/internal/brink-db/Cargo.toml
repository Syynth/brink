[package]
name = "brink-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Incremental project database for inkle's ink narrative scripting language"

[dependencies]
brink-syntax = { workspace = true }
brink-syntax-native = { workspace = true }
brink-ir = { workspace = true }
# brink-db owns ALL query APIs (scripting-substrate spec §3): it is the one
# crate that knows salsa exists. That pulls the analyzer and the inkb backend
# up into its dependency set so the layer-2/3 queries can be defined here.
brink-analyzer = { workspace = true }
brink-codegen-inkb = { workspace = true }
brink-format = { workspace = true }
brink-source-tree = { workspace = true }
rowan.workspace = true
salsa.workspace = true
tracing.workspace = true
thiserror.workspace = true

[features]
# Salsa memo-table/heap introspection (issue #529): an explicit opt-in so
# ordinary consumers (brink-lsp, brink-ide, brink-web/wasm) never pull in
# salsa's `salsa_unstable` surface or its extra compiled code. Only the
# editor-session memory profiling harness
# (brink-test-harness/src/bin/editor_session_bench.rs) enables it.
memory-introspection = ["salsa/salsa_unstable"]

[lints]
workspace = true
