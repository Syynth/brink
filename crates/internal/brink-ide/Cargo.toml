[package]
name = "brink-ide"
description = "Protocol-agnostic IDE query library for inkle's ink"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
brink-syntax = { workspace = true }
brink-syntax-native = { workspace = true }
brink-ir = { workspace = true }
brink-analyzer = { workspace = true }
brink-format = { workspace = true }
brink-db = { workspace = true }
brink-fmt = { workspace = true }
rowan.workspace = true
serde.workspace = true
# `dialect_config` (#3387): `brink.toml [dialogue]` resolves into a
# `DialogueDialect` here, the tooling layer — the config crate only parses.
brink-project-config = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# `test-util` (issue #2168): `extract.rs`'s tests compile inline ink source
# directly, bypassing `brink_environment::compile(&Environment)` (#1306,
# the production road) — gated the same way every such test target is.
brink-compiler = { path = "../../brink-compiler", features = ["test-util"] }
brink-runtime = { path = "../../brink-runtime" }
# `stdlib_sources()` (issue #2318): the regression test for the std-mount /
# `is_all_native` collision needs the SAME mounted stdlib text the editor
# itself feeds `IdeSession::update_source` with — a hand-copied stand-in
# would drift from the real preset the moment it changes.
brink-environment = { workspace = true }
# `parse_str` (issue #2885): native test fixtures resolve their
# `AnalysisOptions` through a real `brink.toml` + `apply_project_config`,
# the same seam `brink-cli`'s `Project::ide_session()` and `brink-web`'s
# `EditorSession::apply_parsed_config` use — not a bare, unconfigured
# session. See `crate::hover::tests::native_session`.
insta.workspace = true

[lints]
workspace = true
