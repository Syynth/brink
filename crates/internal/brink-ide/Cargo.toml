[package]
name = "brink-ide"
description = "Protocol-agnostic IDE query library for inkle's ink"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
brink-syntax = { workspace = true }
brink-syntax-native = { workspace = true }
brink-ir = { workspace = true }
brink-analyzer = { workspace = true }
brink-format = { workspace = true }
brink-db = { workspace = true }
brink-fmt = { workspace = true }
rowan.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
# `test-util` (issue #2168): `extract.rs`'s tests compile inline ink source
# directly, bypassing `brink_environment::compile(&Environment)` (#1306,
# the production road) — gated the same way every such test target is.
brink-compiler = { path = "../../brink-compiler", features = ["test-util"] }
brink-runtime = { path = "../../brink-runtime" }
insta.workspace = true
serde_json.workspace = true

[lints]
workspace = true
