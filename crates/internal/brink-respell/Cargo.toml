[package]
name = "brink-respell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Dev/converter tool: mechanically respells ink corpus fixtures into .brink native source via the brink-ir HIR emitter"

# Dev/converter tool, not a runtime dependency (issue #1178) — never
# published to crates.io, so it must not trip the publishable-crate release
# guard.
publish = false

# Per-worktree build stamp for scripts/check-target-freshness.mjs (#2759) —
# see build.rs's own header for what it writes and why.
build = "build.rs"

[dependencies]
brink-ir = { workspace = true }
brink-syntax = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
brink-test-harness = { workspace = true }
brink-syntax-native = { workspace = true }
brink-driver = { workspace = true }

[lints]
workspace = true
