[package]
name = "brink-test-harness"
description = "Episode-based behavioral testing for brink ink runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Per-worktree build stamp for scripts/check-target-freshness.mjs (#2759) —
# see build.rs's own header for what it writes and why.
build = "build.rs"

[dependencies]
brink-runtime = { workspace = true, features = ["testing"] }
brink-format = { workspace = true, features = ["inkt"] }
# `test-util` (issue #2168): this crate IS test/bench tooling — `corpus.rs`
# and the `compile_bench`/`inkb_hashes` bins compile fixture ink source
# straight off disk via the legacy closure/path entry points, bypassing
# `brink_environment::compile(&Environment)` (#1306, the production road)
# on purpose. A normal (non-dev) dependency since those bins need it
# unconditionally, not just under a test target.
brink-compiler = { workspace = true, features = ["test-util"] }
# For the compile_bench bin (#498): stage-level timing through the production
# driver's own seams (discover / analyze / diagnostics / LIR / codegen).
brink-driver = { workspace = true }
brink-ir = { workspace = true }
brink-codegen-inkb = { workspace = true }
# For `corpus::explore_from_brink_native` (first-light, #1106): the native
# `.brink` frontend, composed by hand (no `brink-db`/salsa, no INCLUDE
# graph) — see that function's doc for why this is the honest minimal path.
brink-syntax-native = { workspace = true }
# For the editor_session_bench bin (#529): drives ProjectDb directly and
# reads its salsa memo-table snapshot. `memory-introspection` is brink-db's
# explicit opt-in to salsa's `salsa_unstable` introspection surface (see that
# crate's Cargo.toml) — no other consumer in the workspace enables it.
brink-db = { workspace = true, features = ["memory-introspection"] }
# For the compile_bench bin's synthetic strict-mode warm run (issue #632 /
# FG-3): `AnalysisOptions`/`Dialect`/`TypePolicy` to configure `types =
# strict` on the persistent db before the edit loop.
brink-analyzer = { workspace = true }
# For the ide_bench bin (measure-first ruling, 2026-08-24): drives the
# off-db analyze road (`IdeSession::update_and_analyze`) the studio editor
# actually pays per keystroke — the road compile_bench's ProjectDb pulls
# never touch.
brink-ide = { workspace = true }
# For corpus/bench case discovery: the shared pruned directory walk (issue
# #1433) every recursive traversal in the workspace routes through, instead
# of each one hand-rolling a `read_dir` recursion.
brink-source-tree = { workspace = true }
# `corpus::compile_via_environment` (issue #2223's parallel gate): the real
# production compile entry point (`brink_environment::compile(&Environment)`,
# #1306) alongside this crate's existing `compile_path`-based helpers, which
# all bypass `Environment` (and its stdlib mount, #2080) entirely. A normal
# (non-dev) dependency because `src/corpus.rs` calls it unconditionally, not
# just from a test target — the same reasoning as `brink-compiler` above.
brink-environment = { workspace = true }
# `corpus::run_native_transcript` (issue #2289): discovers a co-located
# `brink.toml` (if any) the same way `brink_environment::Project::load`
# already does, so a `.brink` fixture that needs `[project] conventions`
# configured (e.g. a conventions module claiming its own file's prose) gets
# the SAME options on both this crate's `compile_path`-based road and the
# `Environment`-based one `environment_parallel_gate.rs` compares it
# against — without this, the two roads would diverge on any fixture that
# added a `brink.toml` only the `Environment` road would ever read.
brink-project-config = { workspace = true }
# `trace::line_identity_diff` (issue #3376): the translation-identity half of
# the equivalence oracle (`docs/observable-semantics-spec.md` §2.2) diffs the
# line tables through the REAL exporter — the same `export_lines` XLIFF units
# and `.inkl` overlays bind to — rather than re-deriving identity from
# `StoryData`, so the oracle cannot drift from what translations actually key
# on.
brink-intl = { workspace = true }
# `opt_fence` (the optimizer fence, `docs/optimizer-spec.md` §5): the
# optimizer itself, so the fence can drive `optimize()` rather than
# reimplementing it. A NORMAL dependency because `src/opt_fence.rs` needs it
# unconditionally; the `test-control` feature is added on the dev-dependency
# below so the control passes exist only for this crate's own test build.
brink-opt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `corpus::expected_mismatch_issue` (issue #3402): reads a case's
# `metadata.toml` `[source] expected_mismatch` field so the oracle harness
# can pin known, permanent divergences mechanically instead of by a prose
# doc comment.
toml = { workspace = true }

[dev-dependencies]
# The negative-control passes (`tests/opt_negative_control.rs`). Enabled here
# rather than in `[dependencies]` so nothing outside this crate's test build
# can reach them. Note `cargo test --workspace` unifies features, so the real
# guard against a control running on a real artifact is the runtime assertion
# in `brink_opt::OptConfig::defaults`, not this line.
brink-opt = { workspace = true, features = ["test-control"] }
insta = { workspace = true }
proptest = { workspace = true }
brink-syntax = { path = "../brink-syntax" }
# For the corpus differential oracle (issue #898): extracting a fixed
# corpus case's seeded VAR literal (grid/weights/values/sequences) out of
# its story.ink source text, and its printed result out of the golden
# transcript — already a workspace dep (brink-ir uses it for the
# dialogue-dialect pattern subset), no new dependency added.
regex = { workspace = true }

[features]
# T2 ground-truth effect-completeness harness (issue #870): forwards to
# `brink-runtime`'s bench/test-only `effect-trace` recorder. Not part of
# `default` — `cargo test --workspace` never builds
# `tests/t2_ground_truth_effects.rs` (see that file's `required-features`);
# CI exercises it via the `Test (all features)` job's
# `cargo test --workspace --all-features --exclude bevy-brink`, not a
# dedicated job.
effect-trace = ["brink-runtime/effect-trace"]
# D8 debugger control seam (issue #3186): forwards to `brink-runtime`'s
# `debug-hooks` feature. Same shape as `effect-trace` above — not part of
# `default`, so `cargo test --workspace` never builds
# `tests/debug_control_3186.rs`; CI's `Test (all features)` job
# (`cargo test --workspace --all-features --exclude bevy-brink`) is what
# exercises it, and the D8 build gate runs the workspace gate once per
# feature state (off, then on) per the issue's own step-limit-ruling
# requirement to prove the disabled build is unaffected.
debug-hooks = ["brink-runtime/debug-hooks"]

[[test]]
name = "t2_ground_truth_effects"
required-features = ["effect-trace"]

[[test]]
name = "debug_control_3186"
required-features = ["debug-hooks"]

[[test]]
name = "debug_sessions"
required-features = ["debug-hooks"]

[[test]]
name = "debug_seam_3223_3224_3226"
required-features = ["debug-hooks"]

[lints]
workspace = true
