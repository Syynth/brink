[package]
name = "brink-test-harness"
description = "Episode-based behavioral testing for brink ink runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
brink-runtime = { workspace = true, features = ["testing"] }
brink-format = { workspace = true, features = ["inkt"] }
brink-compiler = { workspace = true }
# For the compile_bench bin (#498): stage-level timing through the production
# driver's own seams (discover / analyze / diagnostics / LIR / codegen).
brink-driver = { workspace = true }
brink-ir = { workspace = true }
brink-codegen-inkb = { workspace = true }
# For the editor_session_bench bin (#529): drives ProjectDb directly and
# reads its salsa memo-table snapshot. `memory-introspection` is brink-db's
# explicit opt-in to salsa's `salsa_unstable` introspection surface (see that
# crate's Cargo.toml) — no other consumer in the workspace enables it.
brink-db = { workspace = true, features = ["memory-introspection"] }
# For the compile_bench bin's synthetic strict-mode warm run (issue #632 /
# FG-3): `AnalysisOptions`/`Dialect`/`TypePolicy` to configure `types =
# strict` on the persistent db before the edit loop.
brink-analyzer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
brink-syntax = { path = "../brink-syntax" }
# For the corpus differential oracle (issue #898): extracting a fixed
# corpus case's seeded VAR literal (grid/weights/values/sequences) out of
# its story.ink source text, and its printed result out of the golden
# transcript — already a workspace dep (brink-ir uses it for the
# dialogue-dialect pattern subset), no new dependency added.
regex = { workspace = true }

[features]
# T2 ground-truth effect-completeness harness (issue #870): forwards to
# `brink-runtime`'s bench/test-only `effect-trace` recorder. Not part of
# `default` — `cargo test --workspace` never builds
# `tests/t2_ground_truth_effects.rs` (see that file's `required-features`);
# CI runs it as its own job with `--features effect-trace`.
effect-trace = ["brink-runtime/effect-trace"]

[[test]]
name = "t2_ground_truth_effects"
required-features = ["effect-trace"]

[lints]
workspace = true
