[package]
name = "brink-format"
description = "Binary interface between brink compiler and runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# `inkt-write` exposes the dependency-free `.inkt` writer (`write_inkt`).
# `inkt` adds the reader (`read_inkt`), which needs the `pest` parser.
inkt-write = []
inkt = ["inkt-write", "dep:pest", "dep:pest_derive"]

[dependencies]
bitflags = { workspace = true }
pest = { workspace = true, optional = true }
pest_derive = { workspace = true, optional = true }
serde = { workspace = true }

[dev-dependencies]
brink-converter = { path = "../brink-converter" }
brink-json = { path = "../brink-json" }
insta = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
