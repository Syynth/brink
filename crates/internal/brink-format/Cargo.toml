[package]
name = "brink-format"
description = "Binary interface between brink compiler and runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
# `std` gates the handful of spots that need the standard library: the
# `DefaultHasher`-backed fast path of `content_hash`, and pulling in
# `serde/std`. Without it the crate is `no_std` + `alloc` (see
# `docs/no-std-portability.md`). `inkt`/`inkt-write` are NOT part of the
# no_std surface — `pest` is std-oriented — so they're independent of `std`.
std = ["serde/std"]
# `inkt-write` exposes the dependency-free `.inkt` writer (`write_inkt`).
# `inkt` adds the reader (`read_inkt`), which needs the `pest` parser.
inkt-write = []
inkt = ["inkt-write", "dep:pest", "dep:pest_derive"]

[dependencies]
bitflags = { workspace = true }
# NS-A8 numeric tower (T1): glam-backed value kinds. The workspace table pins
# `default-features = false` + `libm`, which keeps this crate's no_std build
# intact and keeps glam's `serde` feature OFF (T5: the wire is hand-written
# little-endian f32 lanes — never glam memory layout, never serde-through-glam).
glam = { workspace = true }
pest = { workspace = true, optional = true }
pest_derive = { workspace = true, optional = true }
# Not `workspace = true`: this crate needs `default-features = false` (no
# `std`) to support the no_std build, which Cargo won't let a member
# override when the workspace table leaves `default-features` implicit.
# Version matches `workspace.dependencies.serde`.
serde = { version = "1", default-features = false, features = ["alloc", "derive", "rc"] }

[dev-dependencies]
brink-compiler = { path = "../../brink-compiler" }
insta = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
