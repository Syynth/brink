[package]
name = "brink-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CLI for compiling and running ink stories"

# The installed command is `brink` (the crate keeps the `brink-cli` name so the
# umbrella `brink` crate can own that name on crates.io).
[[bin]]
name = "brink"
path = "src/main.rs"

[dependencies]
brink-compiler = { workspace = true }
brink-environment = { workspace = true }
brink-driver = { workspace = true }
brink-db = { workspace = true }
brink-ide = { workspace = true }
brink-ir = { workspace = true }
brink-analyzer = { workspace = true }
brink-project-config = { workspace = true }
brink-fmt = { workspace = true }
brink-format = { workspace = true, features = ["inkt"] }
brink-intl = { workspace = true }
brink-runtime = { workspace = true }
xliff2 = { workspace = true }
clap.workspace = true
rowan.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ratatui.workspace = true

[lints]
workspace = true
