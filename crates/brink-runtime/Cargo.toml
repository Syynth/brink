[package]
name = "brink-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Runtime/VM for executing compiled ink stories"

# Per-worktree build stamp for scripts/check-target-freshness.mjs (#2759) —
# see build.rs's own header for what it writes and why.
build = "build.rs"

[package.metadata.docs.rs]
all-features = true

[dependencies]
# Not `workspace = true` for `serde`/`thiserror`: this crate needs
# `default-features = false` (no `std`) to support the no_std build, which
# Cargo won't let a member override when the workspace table leaves
# `default-features` implicit. Versions match `workspace.dependencies`.
brink-format = { path = "../internal/brink-format", version = "0.0.16", default-features = false }
# NS-A8 numeric tower (T1): glam is the in-memory compute type. The
# workspace table pins `default-features = false` + `libm` — no_std-clean,
# and glam's `serde` feature stays OFF (T5: the wire is hand-written lanes).
glam = { workspace = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive", "rc"] }
thiserror = { version = "2", default-features = false }

[features]
default = ["std"]
# `std` gates the parts of the runtime that need the standard library.
# Without it the crate is `no_std` + `alloc` (see
# `docs/no-std-portability.md`): the persistent `Map` type falls back from
# `std::collections::HashMap` to `alloc::collections::BTreeMap`, and a
# handful of `std::`-only call sites (mostly in test-only code) are gated
# out. Public API and behavior under the default `std` build are unchanged.
std = ["brink-format/std", "serde/std", "thiserror/std"]
testing = []
# Bench-only debug counters (issue #821 Workstream B seed): Arc-clone /
# COW-copy event counts behind a feature flag so the instrumentation is a
# compile-time cut, not a runtime toggle — off by default (not part of
# `default`, and no released consumer should ever enable it), so ordinary
# builds pay exactly zero cost. See `crates/brink-runtime/src/bench_counters.rs`
# and `docs/runtime-bench.md`.
bench-counters = []
# Ground-truth effect-atom recorder (issue #870, T2 effects epic — the
# effects analogue of the oracle): records per-executing-def cell
# reads/writes and external-kind calls actually observed at runtime, for
# `brink-test-harness` to compare against the statically-inferred
# `effects(def)` row. Test/bench-only — pulls in `std` (a `Mutex`-guarded
# recorder) and is never part of `default`, so an ordinary build (or
# `cargo build -p brink-runtime`) never compiles it in: no module, no
# lock, no call-site branches. See `crates/brink-runtime/src/effect_trace.rs`.
effect-trace = ["std"]
# Debugger control seam (D8, issue #3186; wire encoding designed in
# `docs/debugger-spec.md`, VM-seam ruling §1.4): breakpoints, pause/resume,
# and step in/over/out, plus a `WatchpointObserver` built on the existing
# `WriteObserver` seam (`state.rs`). Follows the `effect-trace`/
# `bench-counters` precedent — a distinct flag, not a widening of
# `testing` — and, unlike those two, adds ZERO code to the production hot
# loop: `debug_control`'s stepping wraps the existing `pub(crate) vm::step`
# in its OWN loop from outside `flow_instance.rs::advance_with_limit`
# entirely, rather than adding a cfg-gated branch inside it. So the
# production step loop and `vm::step_impl`'s dispatch body are byte-for-byte
# identical whether this feature is on or off — see
# `crates/brink-runtime/src/debug_control.rs`'s module doc for the argument
# in full. Off by default; no released consumer should enable it.
debug-hooks = []

[dev-dependencies]
# `test-util` (issue #2168): tests and `benches/runtime.rs` compile
# inline/fixture ink source directly, bypassing
# `brink_environment::compile(&Environment)` (#1306, the production road)
# — gated the same way every such test/bench target is.
brink-compiler = { path = "../brink-compiler", features = ["test-util"] }
# `tests/element.rs`'s `story_from_native_source` (issue #2289): passes an
# explicit `conventions` pointer through `compile_path_with_options` — a
# fixture that inlines its own `@[convention]` handlers now needs one
# configured (an unconfigured handler is `E169`), and `compile_path` itself
# never reads a co-located `brink.toml` (its own doc says it bypasses
# `Environment`/config entirely), so explicit options are the only way.
brink-analyzer.workspace = true
serde_json.workspace = true
divan.workspace = true
proptest.workspace = true

[[bench]]
name = "runtime"
harness = false

[lints]
workspace = true
